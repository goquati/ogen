name: Check

on:
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Check
        run: cd ./tests && ./gradlew :check
