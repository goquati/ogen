name: Check

on:
  pull_request:
    paths-ignore:
      - 'CHANGELOG.md'
      - 'README.md'
  # setup-gradle only writes its cache on the default branch; the runs on main fill the cache the PRs read.
  push:
    branches: [main]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'README.md'
  workflow_call:

# A new push to a PR cancels the run of the previous one.
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The three jobs run in parallel. Only the Kotlin/Native tests need macOS; everything else runs on Linux.
jobs:
  plugin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check the plugin
        run: cd ./plugin && ./gradlew build

      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-plugin
          path: plugin/build/reports/tests/

  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Node.js and Yarn of the JS/Wasm tests live in the Gradle user home, outside of what is cached by default.
          gradle-home-cache-includes: |
            caches
            notifications
            nodejs
            yarn

      # Keep the excluded task in sync with the tasks of the tests-native job: a native test task missing in
      # both lists runs nowhere.
      - name: Check the test projects (without Kotlin/Native)
        run: >-
          cd ./tests && ./gradlew check
          -x :models-kmp:macosArm64Test

      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-tests
          path: tests/*/build/reports/tests/

  tests-native:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The Kotlin/Native distribution lives in ~/.konan, outside of the Gradle user home.
      - name: Cache Kotlin/Native
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/gradle/libs.versions.toml', 'lib/gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-

      # The tests run for macOS only: the generated code is common code, and an iOS test run needs a simulator,
      # which takes minutes to boot. iOS is still compiled.
      # --no-parallel: the Kotlin/Native compilations would otherwise run at the same time in the one Gradle
      # daemon, which already needs a raised Metaspace for a single one (see tests/gradle.properties).
      - name: Check the test projects (Kotlin/Native)
        run: >-
          cd ./tests && ./gradlew --no-parallel
          :models-kmp:macosArm64Test
          :models-kmp:compileKotlinIosArm64

      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-native
          path: tests/models-kmp/build/reports/tests/
