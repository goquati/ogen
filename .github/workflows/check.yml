name: Check

on:
  pull_request:
    paths-ignore:
      - 'CHANGELOG.md'
      - 'README.md'
  workflow_call:

jobs:
  check:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check the plugin
        id: check-plugin
        run: cd ./plugin && ./gradlew build

      - name: Check the test projects
        id: check
        run: cd ./tests && ./gradlew check

      - name: Upload test reports
        if: ${{ always() && (steps.check-plugin.outcome == 'failure' || steps.check.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            plugin/build/reports/tests/
            tests/*/build/reports/tests/
