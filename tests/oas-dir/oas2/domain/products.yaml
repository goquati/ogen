openapi: 3.0.4
info:
  title: ogen test
  description: Product domain spec, merged into the oas2 spec directory.
  version: 1.0.0

paths:
  /api/products:
    get:
      tags:
        - products
      summary: List products
      description: Returns all products.
      operationId: getProducts
      responses:
        '200':
          description: "ok"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

components:
  schemas:
    Product:
      description: A sellable product.
      type: object
      required:
        - id
        - name
      properties:
        id:
          $ref: '../common.yaml#/components/schemas/ProductId'
        name:
          description: Display name of the product.
          type: string
          nullable: true
