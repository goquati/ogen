openapi: 3.0.4
info:
  title: ogen test
  description: Order domain spec, merged into the oas2 spec directory.
  version: 1.0.0

paths:
  /api/orders:
    get:
      tags:
        - orders
      summary: List orders
      description: Returns all orders.
      operationId: getOrders
      responses:
        '200':
          description: "ok"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

components:
  schemas:
    Order:
      description: A customer order.
      type: object
      required:
        - id
        - name
      properties:
        id:
          $ref: '../common.yaml#/components/schemas/OrderId'
        name:
          description: Display name of the order.
          type: string
          nullable: true
