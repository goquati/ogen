openapi: 3.0.4
info:
  title: ogen test
  description: User domain spec, merged into the oas1 spec directory.
  version: 1.0.0

paths:
  /api/public/users:
    get:
      tags:
        - users
      summary: List users
      description: Returns all publicly visible users.
      operationId: getUsers
      responses:
        '200':
          description: "ok"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

components:
  schemas:
    User:
      description: A registered user.
      type: object
      required:
        - id
        - name
      properties:
        id:
          $ref: '../common.yaml#/components/schemas/UserId'
        name:
          description: Display name of the user.
          type: string
          nullable: true
