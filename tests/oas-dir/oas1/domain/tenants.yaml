openapi: 3.0.4
info:
  title: ogen test
  description: Tenant domain spec, merged into the oas1 spec directory.
  version: 1.0.0

paths:
  /api/public/tenants:
    get:
      tags:
        - tenants
      summary: List tenants
      description: Returns all publicly visible tenants.
      operationId: getTenants
      responses:
        '200':
          description: "ok"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'

components:
  schemas:
    Tenant:
      description: An organizational tenant.
      type: object
      required:
        - id
        - name
      properties:
        id:
          $ref: '../common.yaml#/components/schemas/TenantId'
        name:
          description: Display name of the tenant.
          type: string
          nullable: true
