openapi: 3.0.4
info:
  title: bean validation test spec
  description: Exercises the Jakarta Bean Validation annotations of the generated Spring server.
  version: 1.0.0
paths:
  /api/items/{itemId}:
    parameters:
      - name: itemId
        in: path
        description: ID of the item.
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 5
          pattern: '^[a-z]+$'
    get:
      tags:
        - items
      summary: Get item
      description: Returns the parameters it received.
      operationId: getItem
      parameters:
        - name: limit
          in: query
          description: An integer between 1 and 100.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: A long below 1000, exclusive.
          schema:
            type: integer
            format: int64
            maximum: 1000
            exclusiveMaximum: true
        - name: score
          in: query
          description: A number above 0, exclusive, and at most 1.5.
          schema:
            type: number
            format: double
            minimum: 0
            exclusiveMinimum: true
            maximum: 1.5
        - name: search
          in: query
          description: A string containing 'foo'.
          schema:
            type: string
            pattern: 'foo'
        - name: tags
          in: query
          description: At most two tags.
          schema:
            type: array
            maxItems: 2
            items:
              type: string
        - name: code
          in: query
          description: A code.
          schema:
            $ref: '#/components/schemas/Code'
        - name: x-request-id
          in: header
          description: A request ID of at least three characters.
          schema:
            type: string
            minLength: 3
      responses:
        '200':
          description: the parameters
          content:
            text/plain:
              schema:
                type: string
  /api/items:
    post:
      tags:
        - items
      summary: Create item
      description: Returns the created item.
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Item'
      responses:
        '200':
          description: the item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
  /api/items/batch:
    post:
      tags:
        - items
      summary: Create items
      description: Returns the number of created items.
      operationId: createItems
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 2
              items:
                $ref: '#/components/schemas/Item'
      responses:
        '200':
          description: the number of items
          content:
            application/json:
              schema:
                type: integer
                format: int32
components:
  schemas:
    Code:
      description: Three upper-case letters.
      type: string
      pattern: '^[A-Z]{3}$'
    Percent:
      description: A percentage.
      type: integer
      format: int32
      minimum: 0
      maximum: 100
    Child:
      description: A child of an item.
      type: object
      required:
        - value
      properties:
        value:
          type: string
          maxLength: 3
    Item:
      description: An item with constrained properties.
      type: object
      required:
        - name
        - price
        - code
        - children
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 10
        email:
          type: string
          format: email
        age:
          type: integer
          format: int32
          minimum: 0
          maximum: 150
        price:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
        tags:
          type: array
          maxItems: 3
          items:
            type: string
        attributes:
          type: object
          maxProperties: 2
          additionalProperties:
            type: string
        code:
          $ref: '#/components/schemas/Code'
        otherCode:
          $ref: '#/components/schemas/Code'
        percent:
          $ref: '#/components/schemas/Percent'
        child:
          $ref: '#/components/schemas/Child'
        children:
          type: array
          items:
            $ref: '#/components/schemas/Child'
