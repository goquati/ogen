openapi: 3.1.0
info:
  title: OpenStack Networking API
  description: |-
    This is a reference for the OpenStack Networking API which is provided by the
    Neutron project. To learn more about the OpenStack Networking API concepts,
    please refer to the [API reference](https://docs.openstack.org/api-ref/network/v2/index.html).

    The Networking API v2.0 has no microversions; optional features are announced
    through the extensions list (`/extensions`) instead. This document describes
    the core resources plus the extensions that are enabled in effectively every
    deployment: layer-3 routers (`router`, `extraroute`, `extraroute-atomic`),
    floating IPs with port forwardings (`floating-ip-port-forwarding`), security
    groups (`security-group`), subnet pools, address scopes, RBAC policies,
    quotas (`quotas`, `quota_details`), agents (`agent`), availability zones
    (`availability_zone`), network IP availability (`network-ip-availability`),
    and the standard tag API (`standard-attr-tag`).

    Feature groups that are not described here: load balancing (moved to the
    Octavia API), FWaaS, VPNaaS, QoS policies and rules, trunks, BGP speakers,
    metering labels, log resources, segments, address groups, network flavors,
    auto-allocated topology, conntrack helpers, NDP proxies, local IPs, the
    agent scheduler sub-resources (`dhcp-networks`, `l3-routers`), the port
    `bindings` sub-resource, and bulk (multi-item) create request bodies.
  version: '2.0'
servers:
  - url: 'https://{host}/v2.0'
    description: Neutron endpoint. Project-scoped operations carry the project id as a path parameter on each request.
    variables:
      host:
        default: network.example.com
tags:
  - name: networks
    description: Layer-2 networks — list, create, show, update, delete.
  - name: subnets
    description: Subnets — IP address blocks allocated on a network.
  - name: ports
    description: Ports — connection points for attaching devices (servers, routers, DHCP) to a network.
  - name: routers
    description: Layer-3 routers, including interface attach/detach and atomic extra-route editing.
  - name: floating-ips
    description: Floating IPs — externally reachable addresses mapped onto internal ports.
  - name: port-forwardings
    description: Port forwardings on floating IPs (floating-ip-port-forwarding extension).
  - name: security-groups
    description: Security groups — containers for security group rules.
  - name: security-group-rules
    description: Security group rules (immutable; delete and recreate to change).
  - name: subnet-pools
    description: Subnet pools — prefix pools that subnets can be allocated from.
  - name: address-scopes
    description: Address scopes — address-uniqueness domains that subnet pools belong to.
  - name: rbac-policies
    description: RBAC policies granting other projects access to networks and other shareable objects.
  - name: quotas
    description: Per-project networking quotas.
  - name: agents
    description: Networking agents (DHCP, L3, OVN controllers, …) and their liveness (admin).
  - name: availability-zones
    description: Availability zone information for networks and routers.
  - name: network-ip-availability
    description: Total and used IP counts per network and subnet (admin).
  - name: extensions
    description: Extension discovery — the capability list of this Neutron deployment.
  - name: resource-tags
    description: Standard tag API shared by networks, subnets, ports, routers, floating IPs, subnet pools, and security groups.
security:
  - neutronAuth: []
paths:
  /neutron/{project_id}/networks:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      operationId: listNetworks
      tags:
        - networks
      summary: List networks
      description: >-
        Lists networks visible to the caller: the project's own networks, shared
        networks, and external networks. Unknown filter attributes are ignored
        unless the `filter-validation` extension rejects them.
      parameters:
        - $ref: '#/components/parameters/FieldsParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/MarkerParam'
        - $ref: '#/components/parameters/PageReverseParam'
        - $ref: '#/components/parameters/SortKeyParam'
        - $ref: '#/components/parameters/SortDirParam'
        - $ref: '#/components/parameters/NameFilterParam'
        - $ref: '#/components/parameters/DescriptionFilterParam'
        - $ref: '#/components/parameters/AdminStateUpFilterParam'
        - $ref: '#/components/parameters/StatusFilterParam'
        - $ref: '#/components/parameters/ProjectIdFilterParam'
        - $ref: '#/components/parameters/SharedFilterParam'
        - $ref: '#/components/parameters/RouterExternalFilterParam'
        - $ref: '#/components/parameters/MtuFilterParam'
        - $ref: '#/components/parameters/NetworkProviderTypeFilterParam'
        - $ref: '#/components/parameters/TagsParam'
        - $ref: '#/components/parameters/TagsAnyParam'
        - $ref: '#/components/parameters/NotTagsParam'
        - $ref: '#/components/parameters/NotTagsAnyParam'
      responses:
        '200':
          description: Network list, with a pagination link when more results exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworksListResponse'
        default:
          $ref: '#/components/responses/Fault'
    post:
      operationId: createNetwork
      tags:
        - networks
      summary: Create network
      description: >-
        Creates a network. Provider attributes (`provider:*`) and `router:external`
        require admin rights; `shared` requires admin or a matching RBAC policy
        capability.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNetworkRequest'
      responses:
        '201':
          description: The created network.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkResponse'
        default:
          $ref: '#/components/responses/Fault'
  /neutron/{project_id}/networks/{network_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/NetworkIdParam'
    get:
      operationId: getNetwork
      tags:
        - networks
      summary: Show network details
      description: Shows details for a network.
      responses:
        '200':
          description: The network.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkResponse'
        default:
          $ref: '#/components/responses/Fault'
    put:
      operationId: updateNetwork
      tags:
        - networks
      summary: Update network
      description: >-
        Updates the network's name, admin state, MTU, or other mutable attributes.
        Provider attributes are immutable on networks with active ports.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNetworkRequest'
      responses:
        '200':
          description: The updated network.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkResponse'
        default:
          $ref: '#/components/responses/Fault'
    delete:
      operationId: deleteNetwork
      tags:
        - networks
      summary: Delete network
      description: >-
        Deletes the network and its subnets, provided no non-service ports
        (server, router, floating IP) remain on it.
      responses:
        '204':
          description: Network deleted.
        default:
          $ref: '#/components/responses/Fault'
  /neutron/{project_id}/subnets:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      operationId: listSubnets
      tags:
        - subnets
      summary: List subnets
      description: Lists subnets visible to the caller.
      parameters:
        - $ref: '#/components/parameters/FieldsParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/MarkerParam'
        - $ref: '#/components/parameters/PageReverseParam'
        - $ref: '#/components/parameters/SortKeyParam'
        - $ref: '#/components/parameters/SortDirParam'
        - $ref: '#/components/parameters/NameFilterParam'
        - $ref: '#/components/parameters/DescriptionFilterParam'
        - $ref: '#/components/parameters/ProjectIdFilterParam'
        - $ref: '#/components/parameters/NetworkIdFilterParam'
        - $ref: '#/components/parameters/IpVersionFilterParam'
        - $ref: '#/components/parameters/CidrFilterParam'
        - $ref: '#/components/parameters/GatewayIpFilterParam'
        - $ref: '#/components/parameters/EnableDhcpFilterParam'
        - $ref: '#/components/parameters/SubnetPoolIdFilterParam'
        - $ref: '#/components/parameters/SharedFilterParam'
        - $ref: '#/components/parameters/TagsParam'
        - $ref: '#/components/parameters/TagsAnyParam'
        - $ref: '#/components/parameters/NotTagsParam'
        - $ref: '#/components/parameters/NotTagsAnyParam'
      responses:
        '200':
          description: Subnet list, with a pagination link when more results exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubnetsListResponse'
        default:
          $ref: '#/components/responses/Fault'
    post:
      operationId: createSubnet
      tags:
        - subnets
      summary: Create subnet
      description: >-
        Creates a subnet on a network. Pass an explicit `cidr`, or allocate one by
        passing `subnetpool_id` (or `use_default_subnetpool`) together with
        `prefixlen`. `gateway_ip` defaults to the first address; pass null to
        create the subnet without a gateway.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubnetRequest'
      responses:
        '201':
          description: The created subnet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubnetResponse'
        default:
          $ref: '#/components/responses/Fault'
  /neutron/{project_id}/subnets/{subnet_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/SubnetIdParam'
    get:
      operationId: getSubnet
      tags:
        - subnets
      summary: Show subnet details
      description: Shows details for a subnet.
      responses:
        '200':
          description: The subnet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubnetResponse'
        default:
          $ref: '#/components/responses/Fault'
    put:
      operationId: updateSubnet
      tags:
        - subnets
      summary: Update subnet
      description: >-
        Updates the subnet's name, gateway, DNS nameservers, host routes,
        allocation pools, or DHCP flag. `cidr` and `ip_version` are immutable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubnetRequest'
      responses:
        '200':
          description: The updated subnet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubnetResponse'
        default:
          $ref: '#/components/responses/Fault'
    delete:
      operationId: deleteSubnet
      tags:
        - subnets
      summary: Delete subnet
      description: Deletes the subnet, provided no allocated IPs on it remain in use.
      responses:
        '204':
          description: Subnet deleted.
        default:
          $ref: '#/components/responses/Fault'
  /neutron/{project_id}/ports:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      operationId: listPorts
      tags:
        - ports
      summary: List ports
      description: >-
        Lists ports visible to the caller. `fixed_ips` filters use the
        `fixed_ips=ip_address=…` / `fixed_ips=subnet_id=…` key=value syntax and
        may be repeated.
      parameters:
        - $ref: '#/components/parameters/FieldsParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/MarkerParam'
        - $ref: '#/components/parameters/PageReverseParam'
        - $ref: '#/components/parameters/SortKeyParam'
        - $ref: '#/components/parameters/SortDirParam'
        - $ref: '#/components/parameters/NameFilterParam'
        - $ref: '#/components/parameters/DescriptionFilterParam'
        - $ref: '#/components/parameters/AdminStateUpFilterParam'
        - $ref: '#/components/parameters/StatusFilterParam'
        - $ref: '#/components/parameters/ProjectIdFilterParam'
        - $ref: '#/components/parameters/NetworkIdFilterParam'
        - $ref: '#/components/parameters/DeviceIdFilterParam'
        - $ref: '#/components/parameters/DeviceOwnerFilterParam'
        - $ref: '#/components/parameters/MacAddressFilterParam'
        - $ref: '#/components/parameters/FixedIpsFilterParam'
        - $ref: '#/components/parameters/BindingHostIdFilterParam'
        - $ref: '#/components/parameters/TagsParam'
        - $ref: '#/components/parameters/TagsAnyParam'
        - $ref: '#/components/parameters/NotTagsParam'
        - $ref: '#/components/parameters/NotTagsAnyParam'
      responses:
        '200':
          description: Port list, with a pagination link when more results exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortsListResponse'
        default:
          $ref: '#/components/responses/Fault'
    post:
      operationId: createPort
      tags:
        - ports
      summary: Create port
      description: >-
        Creates a port on a network. Omit `fixed_ips` to auto-allocate an address
        on each subnet; `binding:*` attributes other than `binding:vnic_type`
        require admin rights.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePortRequest'
      responses:
        '201':
          description: The created port.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortResponse'
        default:
          $ref: '#/components/responses/Fault'
  /neutron/{project_id}/ports/{port_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/PortIdParam'
    get:
      operationId: getPort
      tags:
        - ports
      summary: Show port details
      description: Shows details for a port. `binding:vif_type`/`binding:vif_details` appear for admins only.
      responses:
        '200':
          description: The port.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortResponse'
        default:
          $ref: '#/components/responses/Fault'
    put:
      operationId: updatePort
      tags:
        - ports
      summary: Update port
      description: >-
        Updates the port's name, admin state, fixed IPs, security groups, allowed
        address pairs, or DHCP options. `network_id` is immutable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePortRequest'
      responses:
        '200':
          description: The updated port.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortResponse'
        default:
          $ref: '#/components/responses/Fault'
    delete:
      operationId: deletePort
      tags:
        - ports
      summary: Delete port
      description: Deletes the port. Ports still owned by a device (server, router) answer 409.
      responses:
        '204':
          description: Port deleted.
        default:
          $ref: '#/components/responses/Fault'
  /neutron/{project_id}/routers:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      operationId: listRouters
      tags:
        - routers
      summary: List routers
      description: Lists routers visible to the caller.
      parameters:
        - $ref: '#/components/parameters/FieldsParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/MarkerParam'
        - $ref: '#/components/parameters/PageReverseParam'
        - $ref: '#/components/parameters/SortKeyParam'
        - $ref: '#/components/parameters/SortDirParam'
        - $ref: '#/components/parameters/NameFilterParam'
        - $ref: '#/components/parameters/DescriptionFilterParam'
        - $ref: '#/components/parameters/AdminStateUpFilterParam'
        - $ref: '#/components/parameters/StatusFilterParam'
        - $ref: '#/components/parameters/ProjectIdFilterParam'
        - $ref: '#/components/parameters/TagsParam'
        - $ref: '#/components/parameters/TagsAnyParam'
        - $ref: '#/components/parameters/NotTagsParam'
        - $ref: '#/components/parameters/NotTagsAnyParam'
      responses:
        '200':
          description: Router list, with a pagination link when more results exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutersListResponse'
        default:
          $ref: '#/components/responses/Fault'
    post:
      operationId: createRouter
      tags:
        - routers
      summary: Create router
      description: >-
        Creates a router, optionally with an external gateway. `distributed` and
        `ha` require admin rights; `enable_snat` inside `external_gateway_info`
        does too.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRouterRequest'
      responses:
        '201':
          description: The created router.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterResponse'
        default:
          $ref: '#/components/responses/Fault'
  /neutron/{project_id}/routers/{router_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/RouterIdParam'
    get:
      operationId: getRouter
      tags:
        - routers
      summary: Show router details
      description: Shows details for a router.
      responses:
        '200':
          description: The router.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterResponse'
        default:
          $ref: '#/components/responses/Fault'
    put:
      operationId: updateRouter
      tags:
        - routers
      summary: Update router
      description: >-
        Updates the router's name, admin state, external gateway, or static
        routes. Replacing `routes` wholesale here races with concurrent editors;
        prefer the atomic `add_extraroutes`/`remove_extraroutes` actions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRouterRequest'
      responses:
        '200':
          description: The updated router.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterResponse'
        default:
          $ref: '#/components/responses/Fault'
    delete:
      operationId: deleteRouter
      tags:
        - routers
      summary: Delete router
      description: Deletes the router. Routers with internal interfaces still attached answer 409.
      responses:
        '204':
          description: Router deleted.
        default:
          $ref: '#/components/responses/Fault'
  /neutron/{project_id}/routers/{router_id}/add_router_interface:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/RouterIdParam'
    put:
      operationId: addRouterInterface
      tags:
        - routers
      summary: Attach an internal interface
      description: >-
        Attaches a subnet or a port to the router as an internal interface. Pass
        exactly one of `subnet_id` or `port_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterInterfaceRequest'
      responses:
        '200':
          description: The attached interface.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterInterfaceResponse'
        default:
          $ref: '#/components/responses/Fault'
  /neutron/{project_id}/routers/{router_id}/remove_router_interface:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/RouterIdParam'
    put:
      operationId: removeRouterInterface
      tags:
        - routers
      summary: Detach an internal interface
      description: >-
        Detaches a subnet or a port from the router. Pass exactly one of
        `subnet_id` or `port_id`; the interface port itself is deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterInterfaceRequest'
      responses:
        '200':
          description: The detached interface.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterInterfaceResponse'
        default:
          $ref: '#/components/responses/Fault'
  /neutron/{project_id}/routers/{router_id}/add_extraroutes:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/RouterIdParam'
    put:
      operationId: addRouterExtraroutes
      tags:
        - routers
      summary: Add extra routes atomically
      description: >-
        Atomically adds the given static routes to the router's route table
        (extraroute-atomic extension). Routes already present are left in place.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterRoutesRequest'
      responses:
        '200':
          description: The router with its updated route table.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterResponse'
        default:
          $ref: '#/components/responses/Fault'
  /neutron/{project_id}/routers/{router_id}/remove_extraroutes:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/RouterIdParam'
    put:
      operationId: removeRouterExtraroutes
      tags:
        - routers
      summary: Remove extra routes atomically
      description: >-
        Atomically removes the given static routes from the router's route table
        (extraroute-atomic extension). Routes not present are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterRoutesRequest'
      responses:
        '200':
          description: The router with its updated route table.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterResponse'
        default:
          $ref: '#/components/responses/Fault'
  /neutron/{project_id}/floatingips:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      operationId: listFloatingIps
      tags:
        - floating-ips
      summary: List floating IPs
      description: Lists floating IPs visible to the caller.
      parameters:
        - $ref: '#/components/parameters/FieldsParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/MarkerParam'
        - $ref: '#/components/parameters/PageReverseParam'
        - $ref: '#/components/parameters/SortKeyParam'
        - $ref: '#/components/parameters/SortDirParam'
        - $ref: '#/components/parameters/DescriptionFilterParam'
        - $ref: '#/components/parameters/StatusFilterParam'
        - $ref: '#/components/parameters/ProjectIdFilterParam'
        - $ref: '#/components/parameters/FloatingNetworkIdFilterParam'
        - $ref: '#/components/parameters/FloatingIpAddressFilterParam'
        - $ref: '#/components/parameters/FixedIpAddressFilterParam'
        - $ref: '#/components/parameters/PortIdFilterParam'
        - $ref: '#/components/parameters/RouterIdFilterParam'
        - $ref: '#/components/parameters/TagsParam'
        - $ref: '#/components/parameters/TagsAnyParam'
        - $ref: '#/components/parameters/NotTagsParam'
        - $ref: '#/components/parameters/NotTagsAnyParam'
      responses:
        '200':
          description: Floating IP list, with a pagination link when more results exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloatingIpsListResponse'
        default:
          $ref: '#/components/responses/Fault'
    post:
      operationId: createFloatingIp
      tags:
        - floating-ips
      summary: Create floating IP
      description: >-
        Allocates a floating IP from an external network, optionally associating
        it with a port in the same call. Requesting a specific
        `floating_ip_address` is policy-gated (admin by default).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFloatingIpRequest'
      responses:
        '201':
          description: The created floating IP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloatingIpResponse'
        default:
          $ref: '#/components/responses/Fault'
  /neutron/{project_id}/floatingips/{floatingip_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/FloatingIpIdParam'
    get:
      operationId: getFloatingIp
      tags:
        - floating-ips
      summary: Show floating IP details
      description: Shows details for a floating IP, including `port_details` for the associated port.
      responses:
        '200':
          description: The floating IP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloatingIpResponse'
        default:
          $ref: '#/components/responses/Fault'
    put:
      operationId: updateFloatingIp
      tags:
        - floating-ips
      summary: Update floating IP
      description: >-
        Associates the floating IP with a port (`port_id`), moves it, or
        disassociates it (`port_id: null`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFloatingIpRequest'
      responses:
        '200':
          description: The updated floating IP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloatingIpResponse'
        default:
          $ref: '#/components/responses/Fault'
    delete:
      operationId: deleteFloatingIp
      tags:
        - floating-ips
      summary: Delete floating IP
      description: Releases the floating IP back to the external network's pool.
      responses:
        '204':
          description: Floating IP deleted.
        default:
