        '200':
          description: The availability zones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityZonesListResponse'
        default:
          $ref: '#/components/responses/Fault'
  /neutron/{project_id}/network-ip-availabilities:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      operationId: listNetworkIpAvailabilities
      tags:
        - network-ip-availability
      summary: List network IP availability
      description: Lists total and used IP counts for all networks (admin).
      parameters:
        - $ref: '#/components/parameters/NetworkIdFilterParam'
        - $ref: '#/components/parameters/NetworkNameFilterParam'
        - $ref: '#/components/parameters/IpVersionFilterParam'
        - $ref: '#/components/parameters/ProjectIdFilterParam'
      responses:
        '200':
          description: IP availability per network.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkIpAvailabilitiesListResponse'
        default:
          $ref: '#/components/responses/Fault'
  /neutron/{project_id}/network-ip-availabilities/{network_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/NetworkIdParam'
    get:
      operationId: getNetworkIpAvailability
      tags:
        - network-ip-availability
      summary: Show network IP availability
      description: Shows total and used IP counts for one network, per subnet (admin).
      responses:
        '200':
          description: The network's IP availability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkIpAvailabilityResponse'
        default:
          $ref: '#/components/responses/Fault'
  /neutron/{project_id}/extensions:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      operationId: listExtensions
      tags:
        - extensions
      summary: List extensions
      description: Lists the extensions enabled in this deployment; the substitute for microversion discovery.
      responses:
        '200':
          description: The extensions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionsListResponse'
        default:
          $ref: '#/components/responses/Fault'
  /neutron/{project_id}/extensions/{alias}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/ExtensionAliasParam'
    get:
      operationId: getExtension
      tags:
        - extensions
      summary: Show extension details
      description: Shows details for one extension by alias.
      responses:
        '200':
          description: The extension.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionResponse'
        default:
          $ref: '#/components/responses/Fault'
  /neutron/{project_id}/{resource_type}/{resource_id}/tags:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/TagResourceTypeParam'
      - $ref: '#/components/parameters/TagResourceIdParam'
    get:
      operationId: listResourceTags
      tags:
        - resource-tags
      summary: List resource tags
      description: Lists the tags on a resource (standard-attr-tag extension).
      responses:
        '200':
          description: The tags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceTags'
        default:
          $ref: '#/components/responses/Fault'
    put:
      operationId: replaceResourceTags
      tags:
        - resource-tags
      summary: Replace resource tags
      description: Replaces the full tag set on the resource.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceTags'
      responses:
        '200':
          description: The resulting tags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceTags'
        default:
          $ref: '#/components/responses/Fault'
    delete:
      operationId: deleteResourceTags
      tags:
        - resource-tags
      summary: Delete all resource tags
      description: Removes every tag from the resource.
      responses:
        '204':
          description: Tags deleted.
        default:
          $ref: '#/components/responses/Fault'
  /neutron/{project_id}/{resource_type}/{resource_id}/tags/{tag}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/TagResourceTypeParam'
      - $ref: '#/components/parameters/TagResourceIdParam'
      - $ref: '#/components/parameters/TagParam'
    get:
      operationId: checkResourceTag
      tags:
        - resource-tags
      summary: Check tag existence
      description: Answers 204 when the resource has the tag and 404 when it does not.
      responses:
        '204':
          description: The resource has the tag.
        default:
          $ref: '#/components/responses/Fault'
    put:
      operationId: addResourceTag
      tags:
        - resource-tags
      summary: Add a tag
      description: Adds a single tag to the resource. The request has no body; adding an existing tag is a no-op.
      responses:
        '201':
          description: Tag added.
        default:
          $ref: '#/components/responses/Fault'
    delete:
      operationId: deleteResourceTag
      tags:
        - resource-tags
      summary: Delete a tag
      description: Removes a single tag from the resource.
      responses:
        '204':
          description: Tag deleted.
        default:
          $ref: '#/components/responses/Fault'
components:
  securitySchemes:
    neutronAuth:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: A valid Keystone authentication token.
  parameters:
    ProjectIdParam:
      name: project_id
      in: path
      required: true
      description: Keystone project (tenant) id that scopes this request.
      schema:
        type: string
    NetworkIdParam:
      name: network_id
      in: path
      required: true
      description: The UUID of the network.
      schema:
        type: string
    SubnetIdParam:
      name: subnet_id
      in: path
      required: true
      description: The UUID of the subnet.
      schema:
        type: string
    PortIdParam:
      name: port_id
      in: path
      required: true
      description: The UUID of the port.
      schema:
        type: string
    RouterIdParam:
      name: router_id
      in: path
      required: true
      description: The UUID of the router.
      schema:
        type: string
    FloatingIpIdParam:
      name: floatingip_id
      in: path
      required: true
      description: The UUID of the floating IP.
      schema:
        type: string
    PortForwardingIdParam:
      name: port_forwarding_id
      in: path
      required: true
      description: The UUID of the port forwarding.
      schema:
        type: string
    SecurityGroupIdParam:
      name: security_group_id
      in: path
      required: true
      description: The UUID of the security group.
      schema:
        type: string
    SecurityGroupRuleIdParam:
      name: security_group_rule_id
      in: path
      required: true
      description: The UUID of the security group rule.
      schema:
        type: string
    SubnetPoolIdParam:
      name: subnetpool_id
      in: path
      required: true
      description: The UUID of the subnet pool.
      schema:
        type: string
    AddressScopeIdParam:
      name: address_scope_id
      in: path
      required: true
      description: The UUID of the address scope.
      schema:
        type: string
    RbacPolicyIdParam:
      name: rbac_policy_id
      in: path
      required: true
      description: The UUID of the RBAC policy.
      schema:
        type: string
    QuotaTenantIdParam:
      name: tenant_id
      in: path
      required: true
      description: Project id whose quotas are shown or managed.
      schema:
        type: string
    AgentIdParam:
      name: agent_id
      in: path
      required: true
      description: The UUID of the agent.
      schema:
        type: string
    ExtensionAliasParam:
      name: alias
      in: path
      required: true
      description: The alias of the extension, e.g. router or standard-attr-tag.
      schema:
        type: string
    TagResourceTypeParam:
      name: resource_type
      in: path
      required: true
      description: Collection name of the tagged resource type.
      schema:
        type: string
        enum:
          - networks
          - subnets
          - ports
          - routers
          - floatingips
          - subnetpools
          - security-groups
    TagResourceIdParam:
      name: resource_id
      in: path
      required: true
      description: The UUID of the tagged resource.
      schema:
        type: string
    TagParam:
      name: tag
      in: path
      required: true
      description: The tag (max 255 characters; must not contain commas or slashes).
      schema:
        type: string
    FieldsParam:
      name: fields
      in: query
      required: false
      description: >-
        Attribute name to include in the response, projecting away all others.
        May be given multiple times.
      schema:
        type: string
    LimitParam:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return; enables paginated responses.
      schema:
        type: integer
        minimum: 1
    MarkerParam:
      name: marker
      in: query
      required: false
      description: The id of the last item on the previous page; the listing starts after it.
      schema:
        type: string
    PageReverseParam:
      name: page_reverse
      in: query
      required: false
      description: Reverse the page direction, listing items before the marker instead of after it.
      schema:
        type: boolean
    SortKeyParam:
      name: sort_key
      in: query
      required: false
      description: >-
        Resource attribute to sort by (e.g. id, name, status). May be given
        multiple times; each occurrence must be paired with a sort_dir.
      schema:
        type: string
    SortDirParam:
      name: sort_dir
      in: query
      required: false
      description: Sort direction; may be given multiple times, one per sort_key.
      schema:
        type: string
        enum:
          - asc
          - desc
    NameFilterParam:
      name: name
      in: query
      required: false
      description: Filter by name (exact match).
      schema:
        type: string
    DescriptionFilterParam:
      name: description
      in: query
      required: false
      description: Filter by description (exact match).
      schema:
        type: string
    AdminStateUpFilterParam:
      name: admin_state_up
      in: query
      required: false
      description: Filter by administrative state.
      schema:
        type: boolean
    StatusFilterParam:
      name: status
      in: query
      required: false
      description: Filter by status (e.g. ACTIVE, DOWN, BUILD, ERROR).
      schema:
        type: string
    ProjectIdFilterParam:
      name: project_id
      in: query
      required: false
      description: Filter by owning project id (admin, for cross-project listing).
      schema:
        type: string
    SharedFilterParam:
      name: shared
      in: query
      required: false
      description: Filter by shared flag.
      schema:
        type: boolean
    RouterExternalFilterParam:
      name: 'router:external'
      in: query
      required: false
      description: Filter by external-network flag.
      schema:
        type: boolean
    MtuFilterParam:
      name: mtu
      in: query
      required: false
      description: Filter by MTU.
      schema:
        type: integer
    NetworkProviderTypeFilterParam:
      name: 'provider:network_type'
      in: query
      required: false
      description: Filter by provider network type, e.g. flat, vlan, vxlan, geneve (admin).
      schema:
        type: string
    TagsParam:
      name: tags
      in: query
      required: false
      description: Comma-separated tag list; only resources carrying all of them match.
      schema:
        type: string
    TagsAnyParam:
      name: tags-any
      in: query
      required: false
      description: Comma-separated tag list; resources carrying any of them match.
      schema:
        type: string
    NotTagsParam:
      name: not-tags
      in: query
      required: false
      description: Comma-separated tag list; resources carrying all of them are excluded.
      schema:
        type: string
    NotTagsAnyParam:
      name: not-tags-any
      in: query
      required: false
      description: Comma-separated tag list; resources carrying any of them are excluded.
      schema:
        type: string
    NetworkIdFilterParam:
      name: network_id
      in: query
      required: false
      description: Filter by network id.
      schema:
        type: string
    NetworkNameFilterParam:
      name: network_name
      in: query
      required: false
      description: Filter by network name.
      schema:
        type: string
    IpVersionFilterParam:
      name: ip_version
      in: query
      required: false
      description: Filter by IP version.
      schema:
        type: integer
        enum:
          - 4
          - 6
    CidrFilterParam:
      name: cidr
      in: query
      required: false
      description: Filter by CIDR (exact match).
      schema:
        type: string
    GatewayIpFilterParam:
      name: gateway_ip
      in: query
      required: false
      description: Filter by gateway IP address.
      schema:
        type: string
    EnableDhcpFilterParam:
      name: enable_dhcp
      in: query
      required: false
      description: Filter by DHCP flag.
      schema:
        type: boolean
    SubnetPoolIdFilterParam:
      name: subnetpool_id
      in: query
      required: false
      description: Filter by subnet pool id.
      schema:
        type: string
    DeviceIdFilterParam:
      name: device_id
      in: query
      required: false
      description: Filter by owning device id, e.g. a server UUID.
      schema:
        type: string
    DeviceOwnerFilterParam:
      name: device_owner
      in: query
      required: false
      description: 'Filter by device owner, e.g. compute:nova or network:router_interface.'
      schema:
        type: string
    MacAddressFilterParam:
      name: mac_address
      in: query
      required: false
      description: Filter by MAC address.
      schema:
        type: string
    FixedIpsFilterParam:
      name: fixed_ips
      in: query
      required: false
      description: >-
        Filter by fixed IP, using the key=value syntax
        `fixed_ips=ip_address=10.0.0.5` or `fixed_ips=subnet_id=<uuid>`
        (`ip_address_substr=` for substring match). May be given multiple times.
      schema:
        type: string
    BindingHostIdFilterParam:
      name: 'binding:host_id'
      in: query
      required: false
      description: Filter by the host the port is bound to (admin).
      schema:
        type: string
    FloatingNetworkIdFilterParam:
      name: floating_network_id
      in: query
      required: false
      description: Filter by external network id.
      schema:
        type: string
    FloatingIpAddressFilterParam:
      name: floating_ip_address
      in: query
      required: false
      description: Filter by floating IP address.
      schema:
        type: string
    FixedIpAddressFilterParam:
      name: fixed_ip_address
      in: query
      required: false
      description: Filter by the associated fixed IP address.
      schema:
        type: string
    PortIdFilterParam:
      name: port_id
      in: query
      required: false
      description: Filter by associated port id.
      schema:
        type: string
    RouterIdFilterParam:
      name: router_id
      in: query
      required: false
      description: Filter by the router carrying the association.
      schema:
        type: string
    SecurityGroupIdFilterParam:
      name: security_group_id
      in: query
      required: false
      description: Filter by the security group the rules belong to.
      schema:
        type: string
    DirectionFilterParam:
      name: direction
      in: query
      required: false
      description: Filter by traffic direction.
      schema:
        type: string
        enum:
          - ingress
          - egress
    ProtocolFilterParam:
      name: protocol
      in: query
      required: false
      description: Filter by IP protocol name or number.
      schema:
        type: string
    EthertypeFilterParam:
      name: ethertype
      in: query
      required: false
      description: Filter by ethertype.
      schema:
        type: string
        enum:
          - IPv4
          - IPv6
    RemoteGroupIdFilterParam:
      name: remote_group_id
      in: query
      required: false
      description: Filter by remote security group id.
      schema:
        type: string
    AddressScopeIdFilterParam:
      name: address_scope_id
      in: query
      required: false
      description: Filter by address scope id.
      schema:
        type: string
    IsDefaultFilterParam:
      name: is_default
      in: query
      required: false
      description: Filter by default flag.
      schema:
        type: boolean
    RbacObjectTypeFilterParam:
      name: object_type
      in: query
      required: false
      description: Filter by shared object type, e.g. network, security_group, subnetpool, address_scope.
      schema:
        type: string
    RbacObjectIdFilterParam:
      name: object_id
      in: query
      required: false
      description: Filter by shared object id.
      schema:
        type: string
    RbacActionFilterParam:
      name: action
      in: query
      required: false
      description: Filter by RBAC action (access_as_shared, access_as_external, access_as_readonly).
      schema:
        type: string
    RbacTargetTenantFilterParam:
      name: target_tenant
      in: query
      required: false
      description: Filter by target project id.
      schema:
        type: string
    AgentTypeFilterParam:
      name: agent_type
      in: query
      required: false
      description: Filter by agent type, e.g. DHCP agent, L3 agent, Open vSwitch agent.
      schema:
        type: string
    AgentHostFilterParam:
      name: host
      in: query
      required: false
      description: Filter by the host the agent runs on.
      schema:
        type: string
    AgentBinaryFilterParam:
      name: binary
      in: query
      required: false
      description: Filter by agent executable, e.g. neutron-dhcp-agent.
      schema:
        type: string
    AgentAliveFilterParam:
      name: alive
      in: query
      required: false
      description: Filter by liveness.
      schema:
        type: boolean
  schemas:
    NeutronErrorBody:
      type: object
      properties:
        type:
          type: string
          description: Error class name, e.g. NetworkNotFound.
        message:
          type: string
        detail:
          type: string
      required:
        - type
        - message
    Fault:
      type: object
      description: Neutron error envelope.
      properties:
        NeutronError:
          $ref: '#/components/schemas/NeutronErrorBody'
      required:
        - NeutronError
      example:
        NeutronError:
          type: NetworkNotFound
          message: Network 9bacb3c5-8433-41a5-a163-df95b6c116f2 could not be found.
          detail: ''
    Link:
      type: object
      properties:
        href:
          type: string
        rel:
          type: string
          description: next or previous.
      required:
        - href
        - rel
    ResourceTags:
      type: object
      properties:
        tags:
          type: array
          items:
            type: string
          maxItems: 50
      required:
        - tags
      example:
        tags:
          - production
          - web-tier
    AllocationPool:
      type: object
      description: A contiguous IP address range that DHCP and port creation allocate from.
      properties:
        start:
          type: string
        end:
          type: string
      required:
        - start
        - end
      example:
        start: 10.0.0.2
        end: 10.0.0.254
    StaticRoute:
      type: object
      description: A static route, used for subnet host routes and router extra routes.
      properties:
        destination:
          type: string
          description: Destination CIDR.
        nexthop:
          type: string
          description: Next-hop IP address.
      required:
        - destination
        - nexthop
      example:
        destination: 192.168.40.0/24
        nexthop: 10.0.0.11
    FixedIp:
      type: object
      description: >-
        A fixed IP assignment. Responses always carry both fields; requests may
        pass just a subnet_id (allocate any address on it) or just an ip_address.
      properties:
        ip_address:
          type: string
        subnet_id:
          type: string
    AllowedAddressPair:
      type: object
      description: An extra IP/MAC pair allowed to send traffic through the port.
      properties:
        ip_address:
          type: string
          description: IP address or CIDR.
        mac_address:
          type: string
          description: Defaults to the port's own MAC.
      required:
        - ip_address
    ExtraDhcpOpt:
      type: object
      properties:
        opt_name:
          type: string
          description: DHCP option name, e.g. bootfile-name.
        opt_value:
          type:
            - string
            - 'null'
          description: Pass null to unset the option on update.
        ip_version:
          type: integer
          enum:
            - 4
            - 6
          description: Restrict the option to one IP version.
      required:
        - opt_name
        - opt_value
    DnsAssignment:
      type: object
      description: Internal DNS record assigned to the port (dns-integration extension).
      properties:
        hostname:
          type: string
        ip_address:
          type: string
        fqdn:
          type: string
      required:
        - hostname
        - ip_address
        - fqdn
    Network:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
          description: ACTIVE, DOWN, BUILD, or ERROR.
        admin_state_up:
          type: boolean
        shared:
          type: boolean
          description: Whether the network is shared with other projects through an RBAC policy.
        project_id:
          type: string
        tenant_id:
          type: string
          description: Legacy alias of project_id.
        mtu:
          type: integer
        subnets:
          type: array
          items:
            type: string
          description: Ids of the network's subnets.
        'router:external':
          type: boolean
          description: Whether the network can serve as router gateway and floating IP pool.
        port_security_enabled:
          type: boolean
          description: Default port-security state for new ports on the network.
        availability_zones:
          type: array
          items:
            type: string
        availability_zone_hints:
          type: array
          items:
            type: string
        dns_domain:
          type: string
        qos_policy_id:
          type:
            - string
            - 'null'
        'provider:network_type':
          type: string
          description: flat, vlan, vxlan, geneve, gre, or local (admin).
        'provider:physical_network':
          type:
            - string
            - 'null'
          description: Physical network name for flat/vlan networks (admin).
        'provider:segmentation_id':
          type:
            - integer
            - 'null'
          description: VLAN id or tunnel id, depending on the network type (admin).
        is_default:
          type: boolean
          description: Whether this external network is the default for auto-allocation.
        revision_number:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: string
      required:
        - id
        - name
        - status
        - admin_state_up
        - shared
        - project_id
        - subnets
      example:
        id: d32019d3-bc6e-4319-9c1d-6722fc136a22
        name: private
        description: ''
        status: ACTIVE
        admin_state_up: true
        shared: false
        project_id: 4fd44f30292945e481c7b8a0c8908869
        mtu: 1442
        subnets:
          - 54d6f61d-db07-451c-9ab3-b9609b6b6f0b
        'router:external': false
        port_security_enabled: true
        availability_zones:
          - nova
        revision_number: 2
        created_at: '2024-03-08T09:55:23Z'
        updated_at: '2024-03-08T09:55:25Z'
        tags: []
    NetworksListResponse:
      type: object
      properties:
        networks:
          type: array
          items:
            $ref: '#/components/schemas/Network'
        networks_links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
      required:
        - networks
    NetworkResponse:
      type: object
      properties:
        network:
          $ref: '#/components/schemas/Network'
      required:
        - network
    CreateNetworkRequest:
      type: object
      properties:
        network:
          type: object
          properties:
            name:
              type: string
            description:
              type: string
            admin_state_up:
              type: boolean
            shared:
              type: boolean
              description: Policy-gated (admin by default).
            'router:external':
              type: boolean
              description: Admin only.
            mtu:
              type: integer
            port_security_enabled:
              type: boolean
            dns_domain:
              type: string
            qos_policy_id:
              type: string
            availability_zone_hints:
              type: array
              items:
                type: string
            'provider:network_type':
              type: string
              description: Admin only.
            'provider:physical_network':
              type: string
              description: Admin only.
            'provider:segmentation_id':
              type: integer
              description: Admin only.
            is_default:
              type: boolean
              description: Admin only.
            project_id:
              type: string
              description: Create on behalf of another project (admin).
      required:
        - network
