openapi: 3.0.3
info:
  title: Contradictory constraints
  version: 1.0.0
paths:
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: integer
          minimum: 10
          maximum: 1
    get:
      operationId: getPet
      parameters:
        - $ref: '#/components/parameters/Limit'
        - name: size
          in: query
          schema:
            type: integer
            minimum: 5
            maximum: 5
            exclusiveMaximum: true
        - name: filter
          in: query
          content:
            application/json:
              schema:
                type: string
                minLength: 4
                maxLength: 3
      responses:
        '200':
          description: OK
          headers:
            X-Rate-Limit:
              schema:
                type: integer
                minimum: 2
                exclusiveMinimum: true
                maximum: 2
          content:
            application/json:
              schema:
                type: array
                minItems: 3
                maxItems: 1
                items:
                  type: string
                  minLength: 3
                  maxLength: 1
    put:
      operationId: putPet
      parameters:
        - $ref: '#/components/parameters/Limit'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              minProperties: 2
              maxProperties: 1
      callbacks:
        onUpdate:
          '{$request.body#/url}':
            post:
              requestBody:
                content:
                  application/json:
                    schema:
                      type: integer
                      minimum: 8
                      maximum: 7
              responses:
                '200':
                  description: OK
      responses:
        '204':
          description: No content
components:
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 5
        maximum: 1
  requestBodies:
    NewPet:
      content:
        application/json:
          schema:
            type: object
            minProperties: 3
            maxProperties: 2
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: string
            minLength: 9
            maxLength: 8
  headers:
    Trace:
      content:
        text/plain:
          schema:
            type: string
            minLength: 7
            maxLength: 6
  callbacks:
    Notify:
      '{$request.body#/url}':
        post:
          requestBody:
            content:
              application/json:
                schema:
                  type: integer
                  minimum: 6
                  maximum: 5
          responses:
            '200':
              description: OK
  schemas:
    Pet:
      type: object
      properties:
        count:
          type: integer
          minimum: 10
          maximum: 1
        weight:
          type: number
          minimum: 2.5
          maximum: 2.25
        bothExclusive:
          type: number
          minimum: 3
          exclusiveMinimum: true
          maximum: 3
          exclusiveMaximum: true
        name:
          type: string
          minLength: 5
          maxLength: 2
        tags:
          type: array
          minItems: 3
          maxItems: 1
          items:
            type: string
            minLength: 3
            maxLength: 1
        labels:
          type: object
          additionalProperties:
            type: string
            minLength: 2
            maxLength: 1
        owner:
          type: object
          minProperties: 2
          maxProperties: 1
          properties:
            age:
              type: integer
              minimum: 18
              maximum: 17
    Code:
      type: string
      minLength: 4
      maxLength: 3
    Extended:
      allOf:
        - $ref: '#/components/schemas/Pet'
        - type: object
          properties:
            rank:
              type: integer
              minimum: 3
              maximum: 2
    Choice:
      anyOf:
        - type: integer
          minimum: 3
          maximum: 2
      oneOf:
        - type: string
          minLength: 3
          maxLength: 2
      not:
        type: array
        minItems: 3
        maxItems: 2
        items:
          type: string
