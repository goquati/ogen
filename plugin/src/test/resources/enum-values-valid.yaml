openapi: 3.0.3
info:
  title: Enum values
  version: 1.0.0
paths:
  /items:
    get:
      operationId: listItems
      parameters:
        - name: kind
          in: query
          schema:
            type: string
            enum: [a, b]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
                  enum: [1, 2]
components:
  schemas:
    Ratio:
      type: number
      enum: [1, 1.5]
    Flag:
      type: boolean
      enum: [true, false]
    Item:
      type: object
      properties:
        state:
          type: string
          enum: ["1", "2"]
