openapi: 3.0.3
info:
  title: Path parameters in the path template
  description: >-
    A path-level parameter used by every operation, a referenced parameter, and a parameter inside a path segment,
    all in the template. Item only keeps components.schemas non-null for the naming check.
  version: 1.0.0

paths:
  /owners/{ownerId}/items/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getItem
      parameters:
        - $ref: '#/components/parameters/ownerId'
      responses:
        '200':
          description: OK
    delete:
      operationId: deleteItem
      parameters:
        - $ref: '#/components/parameters/ownerId'
      responses:
        '204':
          description: Deleted
  /files/{fileId}.json:
    get:
      operationId: getFile
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK

components:
  parameters:
    ownerId:
      name: ownerId
      in: path
      required: true
      schema:
        type: string
  schemas:
    Item:
      type: string
