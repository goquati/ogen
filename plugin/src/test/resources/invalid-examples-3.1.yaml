openapi: 3.1.0
info:
  title: Examples their schema doesn't allow
  version: 1.0.0
paths: {}
components:
  schemas:
    Size:
      type: integer
      examples: [1, big, 3]
    Tag:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
      examples:
        - name: a
        - name: b
          color: red
    # unevaluatedProperties checks the keys additionalProperties would (#149).
    Labeled:
      type: object
      properties:
        id: { type: string }
      unevaluatedProperties: { type: integer }
      examples:
        - id: a
          size: 1
        - id: b
          extra: text
    # Next to if/then it is not checked.
    LabeledConditional:
      type: object
      properties:
        id: { type: string }
      if: { required: [id] }
      then: { properties: { extra: { type: string } } }
      unevaluatedProperties: { type: integer }
      examples:
        - id: a
          extra: text
