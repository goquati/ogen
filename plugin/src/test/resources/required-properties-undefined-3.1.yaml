openapi: 3.1.0
info:
  title: Required properties undefined, OpenAPI 3.1
  description: Required entries without a matching property, in schemas that OpenAPI 3.1 parses differently.
  version: 1.0.0

paths: {}

components:
  schemas:
    Base:
      type: object
      properties:
        name: { type: string }
    Closed:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        name: { type: string }
    ClosedUnevaluated:
      type: object
      unevaluatedProperties: false
      required: [code]
      properties:
        name: { type: string }
    RefSibling:
      $ref: '#/components/schemas/Base'
      required: [nmae]
    # swagger-parser shares one object between equal inline schemas in 3.1; NegatedFirst.not.a is met first,
    # under `not`, and SharedLater.x must still be checked.
    NegatedFirst:
      not:
        properties:
          a: { required: [zzz] }
    SharedLater:
      type: object
      properties:
        x: { required: [zzz] }
