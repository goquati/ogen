openapi: 3.0.3
info:
  title: unevaluatedProperties in OpenAPI 3.0
  description: OpenAPI 3.0 doesn't know unevaluatedProperties; code generation and the validator ignore it (#130).
  version: '1'
paths: {}
components:
  schemas:
    # A class without a map of other keys.
    UnevaluatedIgnored: {type: object, properties: {id: {type: string}}, unevaluatedProperties: {type: integer}}
    # unevaluatedProperties false doesn't close the object, so the patterns allow every name.
    PatternsUnevaluatedIgnored:
      type: object
      unevaluatedProperties: false
      patternProperties:
        '^x-': { type: string }
      required: [x-tenant, tenant]
