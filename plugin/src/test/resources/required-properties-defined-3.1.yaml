openapi: 3.1.0
info:
  title: Required properties defined, OpenAPI 3.1
  description: Required entries that a property, a reference or additional and unevaluated properties allow.
  version: 1.0.0

paths: {}

components:
  schemas:
    Base:
      type: object
      properties:
        name: { type: string }
    OpenAny:
      type: object
      required: [anything]
      additionalProperties: true
    OpenSchema:
      type: object
      required: [anything]
      additionalProperties:
        type: string
    OpenUnevaluated:
      type: object
      required: [anything]
      unevaluatedProperties: true
    RefSibling:
      $ref: '#/components/schemas/Base'
      required: [name, extra]
      properties:
        extra: { type: string }
    RefSiblingMember:
      required: [name, extra]
      allOf:
        - $ref: '#/components/schemas/Base'
          properties:
            extra: { type: string }
    # `then`, `else` and `dependentSchemas` constrain the parent's value, so they may require its properties.
    Conditional:
      type: object
      properties:
        kind: { type: string }
        name: { type: string }
        nickname: { type: string }
      if:
        properties:
          kind: { const: person }
      then:
        required: [name]
      else:
        required: [nickname]
      dependentSchemas:
        nickname:
          required: [name]
    # Without additionalProperties, patternProperties allow every name; with false, the names they match (#121).
    PatternsOpen:
      type: object
      patternProperties:
        '^x-': { type: string }
      required: [x-tenant, code]
    PatternsClosedMatching:
      type: object
      additionalProperties: false
      patternProperties:
        '^x-': { type: string }
      required: [x-tenant]
    # A pattern the JVM can't compile may match any name.
    PatternsClosedUncompiled:
      type: object
      additionalProperties: false
      patternProperties:
        '^x-[^]*': { type: string }
      required: [x-tenant]
    # A `false` pattern of one alternative doesn't forbid what another allows.
    PatternsAlternatives:
      required: [x-id]
      oneOf:
        - type: object
          additionalProperties: false
          patternProperties:
            '^x-': { type: string }
        - type: object
          additionalProperties: false
          patternProperties:
            '^x-': { type: string }
            '^x-id$': false
    # unevaluatedProperties false closes the object, but not the names a `then` may evaluate (#130).
    PatternsClosedUnevaluatedConditional:
      type: object
      unevaluatedProperties: false
      patternProperties:
        '^x-': { type: string }
      if: { required: [x-kind] }
      then: { properties: { tenant: { type: string } } }
      required: [x-tenant, tenant]
