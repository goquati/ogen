openapi: 3.0.3
info:
  title: bean validation edge cases
  version: 1.0.0
paths:
  /leaves:
    get:
      operationId: getLeaves
      tags:
        - leaves
      responses:
        '200':
          description: leaves
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Leaf'
        '201':
          description: at most ten leaves
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items:
                  $ref: '#/components/schemas/Leaf'
  /raw:
    post:
      operationId: postRaw
      tags:
        - raw
      requestBody:
        required: false
        content:
          application/json: {}
      responses:
        '204':
          description: no content
  /raw/binary:
    post:
      operationId: postRawBinary
      tags:
        - raw
      requestBody:
        required: false
        content:
          application/octet-stream: {}
      responses:
        '204':
          description: no content
  /raw/binary-stream:
    post:
      operationId: postRawBinaryStream
      tags:
        - raw
      requestBody:
        required: true
        content:
          application/octet-stream: {}
      responses:
        '200':
          description: the items
          content:
            application/x-ndjson:
              schema:
                type: array
                items:
                  type: string
  /raw/binary-required:
    post:
      operationId: postRawBinaryRequired
      tags:
        - raw
      requestBody:
        required: true
        content:
          application/octet-stream: {}
      responses:
        '204':
          description: no content
  /raw/text:
    post:
      operationId: postRawText
      tags:
        - raw
      requestBody:
        content:
          text/plain: {}
          text/csv: {}
      responses:
        '204':
          description: no content
  /raw/text-or-binary:
    post:
      operationId: postRawTextOrBinary
      tags:
        - raw
      requestBody:
        required: true
        content:
          text/plain: {}
          application/octet-stream: {}
      responses:
        '204':
          description: no content
  /raw/typed:
    post:
      operationId: postRawTyped
      tags:
        - raw
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/Leaf'
      responses:
        '204':
          description: no content
  /media-type-parameters/json:
    post:
      operationId: postJsonWithCharset
      tags:
        - mediaTypeParameters
      requestBody:
        required: true
        content:
          application/json; charset=utf-8:
            schema:
              $ref: '#/components/schemas/Leaf'
      responses:
        '200':
          description: the leaf
          content:
            Application/JSON; charset=UTF-8:
              schema:
                $ref: '#/components/schemas/Leaf'
  /media-type-parameters/multipart:
    post:
      operationId: postMultipartWithBoundary
      tags:
        - mediaTypeParameters
      requestBody:
        required: true
        content:
          multipart/form-data; boundary=xyz:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
      responses:
        '200':
          description: the parts
          content:
            multipart/mixed; boundary=abc:
              schema:
                type: object
  /media-type-parameters/ndjson:
    get:
      operationId: getNdjson
      tags:
        - mediaTypeParameters
      responses:
        '200':
          description: the leaves, one per line
          content:
            application/ndjson; charset=utf-8:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Leaf'
  /media-type-parameters/preferred:
    post:
      operationId: postPreferredJson
      tags:
        - mediaTypeParameters
      requestBody:
        required: true
        content:
          application/vnd.a+json:
            schema:
              $ref: '#/components/schemas/Leaf'
          application/json:
            schema:
              $ref: '#/components/schemas/Leaf'
      responses:
        '204':
          description: no content
  /media-type-parameters/profile:
    post:
      operationId: postJsonWithProfile
      tags:
        - mediaTypeParameters
      requestBody:
        required: true
        content:
          Application/JSON; Profile="https://Example.com/a;B":
            schema:
              $ref: '#/components/schemas/Leaf'
      responses:
        '204':
          description: no content
components:
  schemas:
    Leaf:
      type: object
      properties:
        name:
          type: string
    Tree:
      type: array
      items:
        $ref: '#/components/schemas/Tree'
    Node:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/Node'
    Amount:
      type: number
      format: big-decimal
      minimum: 0
    Edge:
      type: object
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
        startOrEnd:
          type: string
          pattern: '^foo|bar$'
        anchored:
          type: string
          pattern: '^[a-z]+$'
        groupedAlternation:
          type: string
          pattern: '^(foo|bar)$'
        escapedDollar:
          type: string
          pattern: '^foo\$'
        smallest:
          type: integer
          format: int64
          minimum: -9223372036854775808
        beyondLong:
          type: integer
          format: int64
          minimum: 10000000000000000000
        nestedClass:
          type: string
          pattern: '^[a-z&&[^x]|]+$'
        mappedToLong:
          type: integer
          format: unix-time
          maximum: 100
        mappedToString:
          type: string
          format: secret
          maxLength: 8
