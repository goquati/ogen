openapi: 3.2.0
info:
  title: QUERY method
  version: '1'
paths:
  /search:
    query:
      tags: [search]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: the matches
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
components:
  schemas:
    SearchRequest:
      type: object
      required: [term]
      properties:
        term:
          type: string
