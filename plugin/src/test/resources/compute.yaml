        default:
          $ref: '#/components/responses/Fault'
    delete:
      operationId: deleteService
      tags:
        - services
      summary: Delete a compute service
      description: >-
        Deletes the service record (admin). A nova-compute service must have no
        instances and be load-balancer-drained first.
      responses:
        '204':
          description: Service deleted.
        default:
          $ref: '#/components/responses/Fault'
  /nova/{project_id}/os-migrations:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      operationId: listMigrations
      tags:
        - migrations
      summary: List migrations
      description: >-
        Lists migration records across all servers (admin). Paginated since 2.59;
        user/project filters since 2.80.
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/MarkerParam'
        - $ref: '#/components/parameters/ChangesSinceParam'
        - $ref: '#/components/parameters/ChangesBeforeParam'
        - name: instance_uuid
          in: query
          required: false
          description: Filter by server UUID.
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Filter by migration status.
          schema:
            type: string
        - name: migration_type
          in: query
          required: false
          description: Filter by type.
          schema:
            type: string
            enum:
              - evacuation
              - live-migration
              - migration
              - resize
        - name: source_compute
          in: query
          required: false
          description: Filter by source compute host.
          schema:
            type: string
        - name: host
          in: query
          required: false
          description: Filter by source or destination host.
          schema:
            type: string
        - name: user_id
          in: query
          required: false
          description: Filter by user id (2.80+).
          schema:
            type: string
        - name: project_id
          in: query
          required: false
          description: Filter by project id (2.80+).
          schema:
            type: string
      responses:
        '200':
          description: The migration records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationsListResponse'
        default:
          $ref: '#/components/responses/Fault'
  /nova/{project_id}/os-availability-zone:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      operationId: listAvailabilityZones
      tags:
        - availability-zones
      summary: List availability zones
      description: Lists availability zone names and states; host details are always null here.
      responses:
        '200':
          description: The availability zones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityZonesListResponse'
        default:
          $ref: '#/components/responses/Fault'
  /nova/{project_id}/os-availability-zone/detail:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      operationId: listAvailabilityZonesDetail
      tags:
        - availability-zones
      summary: List availability zones detailed
      description: Lists availability zones with per-host, per-service liveness details (admin).
      responses:
        '200':
          description: The availability zones with host details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityZonesListResponse'
        default:
          $ref: '#/components/responses/Fault'
  /nova/{project_id}/os-quota-sets/{tenant_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/QuotaTenantIdParam'
    get:
      operationId: getQuotaSet
      tags:
        - quota-sets
      summary: Show quotas
      description: Shows the project's (or, with `user_id`, the user's) quotas.
      parameters:
        - $ref: '#/components/parameters/QuotaUserIdParam'
      responses:
        '200':
          description: The quotas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaSetResponse'
        default:
          $ref: '#/components/responses/Fault'
    put:
      operationId: updateQuotaSet
      tags:
        - quota-sets
      summary: Update quotas
      description: Updates quotas for the project or user (admin). `force` skips usage validation.
      parameters:
        - $ref: '#/components/parameters/QuotaUserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQuotaSetRequest'
      responses:
        '200':
          description: The updated quotas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaSetResponse'
        default:
          $ref: '#/components/responses/Fault'
    delete:
      operationId: deleteQuotaSet
      tags:
        - quota-sets
      summary: Revert quotas to defaults
      description: Reverts the project's (or user's) quotas to their defaults (admin).
      parameters:
        - $ref: '#/components/parameters/QuotaUserIdParam'
      responses:
        '202':
          description: Quotas reverted.
        default:
          $ref: '#/components/responses/Fault'
  /nova/{project_id}/os-quota-sets/{tenant_id}/defaults:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/QuotaTenantIdParam'
    get:
      operationId: getQuotaSetDefaults
      tags:
        - quota-sets
      summary: Show default quotas
      description: Shows the default quotas for the project.
      responses:
        '200':
          description: The default quotas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaSetResponse'
        default:
          $ref: '#/components/responses/Fault'
  /nova/{project_id}/os-quota-sets/{tenant_id}/detail:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/QuotaTenantIdParam'
    get:
      operationId: getQuotaSetDetail
      tags:
        - quota-sets
      summary: Show quotas with usage
      description: Shows the project's quotas with in_use and reserved counts.
      parameters:
        - $ref: '#/components/parameters/QuotaUserIdParam'
      responses:
        '200':
          description: The detailed quotas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaSetDetailResponse'
        default:
          $ref: '#/components/responses/Fault'
  /nova/{project_id}/os-quota-class-sets/{class_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/QuotaClassIdParam'
    get:
      operationId: getQuotaClassSet
      tags:
        - quota-class-sets
      summary: Show quota class
      description: Shows the quotas of a quota class (admin). server_groups fields appear since 2.50.
      responses:
        '200':
          description: The quota class.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaClassSetResponse'
        default:
          $ref: '#/components/responses/Fault'
    put:
      operationId: updateQuotaClassSet
      tags:
        - quota-class-sets
      summary: Update quota class
      description: Creates or updates quotas of a quota class (admin).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQuotaClassSetRequest'
      responses:
        '200':
          description: The updated quota class.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaClassSetResponse'
        default:
          $ref: '#/components/responses/Fault'
  /nova/{project_id}/os-server-groups:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      operationId: listServerGroups
      tags:
        - server-groups
      summary: List server groups
      description: Lists the caller's server groups. Uses limit/offset paging, not marker.
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - name: offset
          in: query
          required: false
          description: Number of groups to skip.
          schema:
            type: integer
            minimum: 0
        - name: all_projects
          in: query
          required: false
          description: List groups of all projects (admin).
          schema:
            type: boolean
      responses:
        '200':
          description: The server groups.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerGroupsListResponse'
        default:
          $ref: '#/components/responses/Fault'
    post:
      operationId: createServerGroup
      tags:
        - server-groups
      summary: Create server group
      description: >-
        Creates a server group. Since 2.64 the request carries a single `policy`
        plus optional `rules` instead of the legacy `policies` array.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServerGroupRequest'
      responses:
        '200':
          description: The created server group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerGroupResponse'
        default:
          $ref: '#/components/responses/Fault'
  /nova/{project_id}/os-server-groups/{server_group_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/ServerGroupIdParam'
    get:
      operationId: getServerGroup
      tags:
        - server-groups
      summary: Show server group details
      description: Shows one server group.
      responses:
        '200':
          description: The server group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerGroupResponse'
        default:
          $ref: '#/components/responses/Fault'
    delete:
      operationId: deleteServerGroup
      tags:
        - server-groups
      summary: Delete server group
      description: Deletes a server group; member servers are not affected.
      responses:
        '204':
          description: Server group deleted.
        default:
          $ref: '#/components/responses/Fault'
  /nova/{project_id}/os-simple-tenant-usage:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      operationId: listTenantUsages
      tags:
        - usage
      summary: List usage for all projects
      description: >-
        Reports simple usage (vcpu/ram/disk hours) for all projects in the given
        time window (admin). Paginated since 2.40; pagination pages by server, so
        a project's usage may be split across pages — aggregate client-side.
      parameters:
        - $ref: '#/components/parameters/UsageStartParam'
        - $ref: '#/components/parameters/UsageEndParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/MarkerParam'
        - name: detailed
          in: query
          required: false
          description: Pass 1 to include per-server usages.
          schema:
            type: integer
            enum:
              - 0
              - 1
      responses:
        '200':
          description: Usage per project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantUsagesListResponse'
        default:
          $ref: '#/components/responses/Fault'
  /nova/{project_id}/os-simple-tenant-usage/{tenant_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/QuotaTenantIdParam'
    get:
      operationId: getTenantUsage
      tags:
        - usage
      summary: Show usage for a project
      description: Reports simple usage for one project, including per-server usages. Paginated since 2.40.
      parameters:
        - $ref: '#/components/parameters/UsageStartParam'
        - $ref: '#/components/parameters/UsageEndParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/MarkerParam'
      responses:
        '200':
          description: The project's usage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantUsageResponse'
        default:
          $ref: '#/components/responses/Fault'
  /nova/{project_id}/os-instance_usage_audit_log:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      operationId: listInstanceUsageAuditLogs
      tags:
        - audit-log
      summary: Show the latest usage audit log
      description: Shows instance usage audit results for the most recent audit period (admin).
      responses:
        '200':
          description: The audit log.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceUsageAuditLogsResponse'
        default:
          $ref: '#/components/responses/Fault'
  /nova/{project_id}/os-instance_usage_audit_log/{before_timestamp}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/BeforeTimestampParam'
    get:
      operationId: getInstanceUsageAuditLog
      tags:
        - audit-log
      summary: Show the usage audit log before a time
      description: Shows instance usage audit results for the audit period containing the given time (admin).
      responses:
        '200':
          description: The audit log.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceUsageAuditLogResponse'
        default:
          $ref: '#/components/responses/Fault'
  /nova/{project_id}/os-server-external-events:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    post:
      operationId: createExternalEvents
      tags:
        - external-events
      summary: Inject external server events
      description: >-
        Informs Nova of events that happened outside it (service-to-service; used
        by Neutron and Cinder). Event names valid at 2.96 include volume-extended
        (2.51+), power-update (2.76+), accelerator-request-bound (2.82+), and
        volume-reimaged (2.93+). Answers 207 when only some events were accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExternalEventsRequest'
      responses:
        '200':
          description: All events accepted; each echoed with a per-event code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalEventsResponse'
        '207':
          description: Some events failed; inspect each event's code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalEventsResponse'
        default:
          $ref: '#/components/responses/Fault'
  /nova/{project_id}/os-assisted-volume-snapshots:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    post:
      operationId: createAssistedVolumeSnapshot
      tags:
        - assisted-volume-snapshots
      summary: Create assisted volume snapshot
      description: >-
        Creates a hypervisor-assisted snapshot of a volume (service-to-service;
        called by Cinder for remote file-system backed volumes).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssistedVolumeSnapshotRequest'
      responses:
        '200':
          description: The snapshot reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistedVolumeSnapshotResponse'
        default:
          $ref: '#/components/responses/Fault'
  /nova/{project_id}/os-assisted-volume-snapshots/{snapshot_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/AssistedSnapshotIdParam'
    delete:
      operationId: deleteAssistedVolumeSnapshot
      tags:
        - assisted-volume-snapshots
      summary: Delete assisted volume snapshot
      description: Deletes a hypervisor-assisted volume snapshot (service-to-service).
      parameters:
        - name: delete_info
          in: query
          required: true
          description: JSON-encoded deletion details, including the volume_id.
          schema:
            type: string
      responses:
        '204':
          description: Deletion accepted.
        default:
          $ref: '#/components/responses/Fault'
  /nova/{project_id}/os-console-auth-tokens/{console_token}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/ConsoleTokenParam'
    get:
      operationId: getConsoleConnectInfo
      tags:
        - console-auth-tokens
      summary: Show console connection information
      description: Resolves a console auth token to its host/port connect information (admin, 2.31+).
      responses:
        '200':
          description: The connection information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleConnectInfoResponse'
        default:
          $ref: '#/components/responses/Fault'
  /:
    servers:
      - url: 'https://{host}'
        description: Endpoint root, outside the versioned base URL.
        variables:
          host:
            default: compute.example.com
    get:
      operationId: listVersions
      tags:
        - versions
      summary: List API versions
      description: Lists the major API versions the endpoint serves. Needs no authentication.
      security: []
      responses:
        '200':
          description: The available versions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionsListResponse'
        default:
          $ref: '#/components/responses/Fault'
  /v2.1:
    servers:
      - url: 'https://{host}'
        description: Endpoint root, outside the versioned base URL.
        variables:
          host:
            default: compute.example.com
    get:
      operationId: getV21VersionDetails
      tags:
        - versions
      summary: Show v2.1 version details
      description: Shows the v2.1 API version document, including the supported microversion range.
      security: []
      responses:
        '200':
          description: The version document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
        default:
          $ref: '#/components/responses/Fault'
  /nova/{project_id}/os-keypairs:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      operationId: listKeypairs
      tags:
        - keypairs
      summary: List keypairs
      description: >-
        Lists keypairs for the caller (or for `user_id` with admin policy, 2.10+).
        Paginated since 2.35.
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/MarkerParam'
        - $ref: '#/components/parameters/KeypairUserIdParam'
      responses:
        '200':
          description: Keypair list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeypairsListResponse'
        default:
          $ref: '#/components/responses/Fault'
    post:
      operationId: createKeypair
      tags:
        - keypairs
      summary: Import keypair
      description: >-
        Imports an existing public key. Since 2.92 `public_key` is mandatory (Nova no
        longer generates keypairs, so `private_key` is never returned) and names may
        contain `@` and `.` characters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKeypairRequest'
      responses:
        '201':
          description: The imported keypair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedKeypairResponse'
        default:
          $ref: '#/components/responses/Fault'
  /nova/{project_id}/os-keypairs/{keypair_name}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/KeypairNameParam'
    get:
      operationId: getKeypair
      tags:
        - keypairs
      summary: Show keypair details
      description: Shows details for a keypair, including database bookkeeping fields.
      parameters:
        - $ref: '#/components/parameters/KeypairUserIdParam'
      responses:
        '200':
          description: The keypair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeypairResponse'
        default:
          $ref: '#/components/responses/Fault'
    delete:
      operationId: deleteKeypair
      tags:
        - keypairs
      summary: Delete keypair
      description: Deletes a keypair owned by the caller (or by `user_id` with admin policy, 2.10+).
      parameters:
        - $ref: '#/components/parameters/KeypairUserIdParam'
      responses:
        '204':
          description: Keypair deleted.
        default:
          $ref: '#/components/responses/Fault'
components:
  securitySchemes:
    novaAuth:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: A valid Keystone authentication token.
  parameters:
    ProjectIdParam:
      name: project_id
      in: path
      required: true
      description: Keystone project (tenant) id that scopes this request.
      schema:
        type: string
    ServerIdParam:
      name: server_id
      in: path
      required: true
      description: The UUID of the server.
      schema:
        type: string
    FlavorIdParam:
      name: flavor_id
      in: path
      required: true
      description: The id of the flavor.
      schema:
        type: string
    KeypairNameParam:
      name: keypair_name
      in: path
      required: true
      description: The name of the keypair.
      schema:
        type: string
    LimitParam:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return. Capped by the deployment's max_limit.
      schema:
        type: integer
        minimum: 1
    MarkerParam:
      name: marker
      in: query
      required: false
      description: The id of the last item on the previous page; the listing starts after it.
      schema:
        type: string
    ChangesSinceParam:
      name: changes-since
      in: query
      required: false
      description: >-
        Only return items last updated at or after this ISO 8601 timestamp.
        Includes deleted items when the resource supports it.
      schema:
        type: string
        format: date-time
    ChangesBeforeParam:
      name: changes-before
      in: query
      required: false
      description: Only return items last updated at or before this ISO 8601 timestamp (2.66+).
      schema:
        type: string
        format: date-time
    AllTenantsParam:
      name: all_tenants
      in: query
      required: false
      description: List items across all projects (admin).
      schema:
        type: boolean
    ServerSortKey:
      name: sort_key
      in: query
      required: false
      description: >-
        Server attribute to sort by (e.g. created_at, display_name, uuid). May be
        given multiple times. Defaults to created_at.
      schema:
        type: string
    ServerSortDir:
      name: sort_dir
      in: query
      required: false
      description: Sort direction; defaults to desc.
      schema:
        type: string
        enum:
          - asc
          - desc
    ServerFilterName:
      name: name
      in: query
      required: false
      description: Filter by server name (regular expression match).
      schema:
        type: string
    ServerFilterStatus:
      name: status
      in: query
      required: false
      description: Filter by server status (e.g. ACTIVE, SHUTOFF, ERROR).
      schema:
        type: string
    ServerFilterImage:
      name: image
      in: query
      required: false
      description: Filter by image id.
      schema:
        type: string
    ServerFilterFlavor:
      name: flavor
      in: query
      required: false
      description: Filter by flavor id.
      schema:
        type: string
    ServerFilterHost:
      name: host
      in: query
      required: false
      description: Filter by compute host name (admin).
      schema:
        type: string
    ServerFilterIp:
      name: ip
      in: query
      required: false
      description: Filter by IPv4 address (regular expression match).
      schema:
        type: string
    ServerFilterIp6:
      name: ip6
      in: query
      required: false
      description: Filter by IPv6 address (regular expression match).
      schema:
        type: string
    ServerFilterAvailabilityZone:
      name: availability_zone
      in: query
      required: false
      description: Filter by availability zone (non-admin since 2.83).
      schema:
        type: string
    ServerFilterConfigDrive:
      name: config_drive
      in: query
      required: false
      description: Filter by config-drive presence (non-admin since 2.83).
      schema:
        type: string
    ServerFilterKeyName:
      name: key_name
      in: query
      required: false
      description: Filter by keypair name (non-admin since 2.83).
      schema:
        type: string
    ServerFilterCreatedAt:
      name: created_at
      in: query
      required: false
      description: Filter by creation time, ISO 8601 (non-admin since 2.83).
      schema:
        type: string
    ServerFilterLaunchedAt:
      name: launched_at
      in: query
      required: false
      description: Filter by launch time, ISO 8601 (non-admin since 2.83).
      schema:
        type: string
    ServerFilterTerminatedAt:
      name: terminated_at
      in: query
      required: false
      description: Filter by termination time, ISO 8601 (non-admin since 2.83).
      schema:
        type: string
    ServerFilterLocked:
      name: locked
      in: query
      required: false
      description: Filter by lock state (2.73+).
      schema:
        type: boolean
    ServerFilterPowerState:
      name: power_state
      in: query
      required: false
      description: 'Filter by power state (admin): 0 NOSTATE, 1 RUNNING, 3 PAUSED, 4 SHUTDOWN, 6 CRASHED, 7 SUSPENDED.'
      schema:
        type: integer
        enum:
          - 0
          - 1
          - 3
          - 4
          - 6
          - 7
    ServerFilterProjectId:
      name: project_id
      in: query
      required: false
      description: Filter by project id; only meaningful together with all_tenants (admin).
      schema:
        type: string
    ServerFilterUserId:
      name: user_id
      in: query
      required: false
      description: Filter by user id (non-admin since 2.83).
      schema:
        type: string
    ServerFilterUuid:
      name: uuid
      in: query
      required: false
      description: Filter by server UUID.
      schema:
        type: string
    ServerFilterVmState:
      name: vm_state
      in: query
      required: false
      description: Filter by vm_state (admin; e.g. active, stopped, error).
      schema:
        type: string
    ServerFilterTaskState:
      name: task_state
      in: query
      required: false
      description: Filter by task_state (admin).
      schema:
        type: string
    ServerFilterHostname:
      name: hostname
      in: query
      required: false
      description: Filter by hostname (non-admin since 2.90).
      schema:
        type: string
    ServerFilterReservationId:
      name: reservation_id
      in: query
      required: false
      description: Filter by the reservation id returned by a multi-server create.
      schema:
        type: string
    ServerFilterDeleted:
      name: deleted
      in: query
      required: false
      description: Include only deleted servers (admin).
      schema:
        type: boolean
    ServerFilterTags:
      name: tags
      in: query
      required: false
      description: Servers that have all of the given tags, comma-separated (2.26+).
      schema:
        type: string
    ServerFilterTagsAny:
      name: tags-any
      in: query
      required: false
      description: Servers that have at least one of the given tags, comma-separated (2.26+).
      schema:
        type: string
    ServerFilterNotTags:
      name: not-tags
      in: query
      required: false
      description: Servers that do not have all of the given tags, comma-separated (2.26+).
      schema:
        type: string
    ServerFilterNotTagsAny:
      name: not-tags-any
      in: query
      required: false
      description: Servers that have none of the given tags, comma-separated (2.26+).
      schema:
        type: string
    FlavorSortKey:
      name: sort_key
      in: query
      required: false
      description: Flavor attribute to sort by (e.g. flavorid, name, memory_mb). Defaults to flavorid.
      schema:
        type: string
    FlavorSortDir:
      name: sort_dir
      in: query
      required: false
      description: Sort direction; defaults to asc.
      schema:
        type: string
        enum:
          - asc
          - desc
    FlavorMinDisk:
      name: minDisk
      in: query
      required: false
      description: Only flavors with at least this much root disk, in GiB.
      schema:
        type: integer
    FlavorMinRam:
      name: minRam
      in: query
      required: false
      description: Only flavors with at least this much RAM, in MiB.
      schema:
        type: integer
    FlavorIsPublic:
      name: is_public
      in: query
      required: false
      description: 'Filter by visibility: true, false, or none for all flavors (admin for non-public).'
      schema:
        type: string
        enum:
          - 'true'
          - 'false'
          - 'none'
    KeypairUserIdParam:
      name: user_id
      in: query
      required: false
      description: Act on keypairs of this user instead of the caller (admin policy, 2.10+).
      schema:
        type: string
    MetadataKeyParam:
      name: key
      in: path
      required: true
      description: The metadata key.
      schema:
        type: string
    NetworkLabelParam:
      name: network_label
      in: path
      required: true
      description: The network label (name).
      schema:
        type: string
    ServerTagParam:
      name: tag
      in: path
      required: true
      description: The tag value.
      schema:
        type: string
    PortIdParam:
      name: port_id
      in: path
      required: true
      description: The UUID of the attached port.
      schema:
        type: string
    AttachedVolumeIdParam:
      name: volume_id
      in: path
      required: true
      description: The UUID of the attached volume.
      schema:
        type: string
    RequestIdParam:
      name: request_id
      in: path
      required: true
      description: The request id of the action.
      schema:
        type: string
    ServerMigrationIdParam:
      name: migration_id
      in: path
      required: true
      description: The id of the migration.
      schema:
        type: integer
    FlavorExtraSpecKeyParam:
      name: key
      in: path
      required: true
      description: The extra spec key, e.g. hw:cpu_policy.
      schema:
        type: string
    AggregateIdParam:
      name: aggregate_id
      in: path
      required: true
      description: The integer id of the aggregate.
      schema:
        type: integer
    HypervisorIdParam:
      name: hypervisor_id
      in: path
      required: true
      description: The UUID of the hypervisor (2.53+).
      schema:
        type: string
    HypervisorHostnamePattern:
      name: hypervisor_hostname_pattern
      in: query
      required: false
      description: Substring filter on the hypervisor hostname (2.53+); incompatible with paging.
      schema:
        type: string
    HypervisorWithServers:
      name: with_servers
      in: query
      required: false
      description: Include the servers hosted on each hypervisor (2.53+).
      schema:
        type: boolean
    ServiceIdParam:
      name: service_id
      in: path
      required: true
      description: The UUID of the service (2.53+).
      schema:
        type: string
    QuotaTenantIdParam:
      name: tenant_id
      in: path
      required: true
      description: The project id.
      schema:
        type: string
    QuotaUserIdParam:
      name: user_id
      in: query
      required: false
      description: Act on the per-user quota of this user within the project.
      schema:
        type: string
    QuotaClassIdParam:
      name: class_id
      in: path
      required: true
      description: The quota class id; the class "default" applies to all projects without specific quotas.
      schema:
        type: string
    ServerGroupIdParam:
      name: server_group_id
      in: path
      required: true
      description: The UUID of the server group.
      schema:
        type: string
    UsageStartParam:
      name: start
      in: query
      required: false
      description: Start of the usage window, ISO 8601; defaults to 4 weeks ago.
      schema:
        type: string
    UsageEndParam:
      name: end
      in: query
      required: false
      description: End of the usage window, ISO 8601; defaults to now.
      schema:
        type: string
    BeforeTimestampParam:
      name: before_timestamp
      in: path
      required: true
      description: Show the audit period that contains this time (ISO 8601).
      schema:
        type: string
    AssistedSnapshotIdParam:
      name: snapshot_id
      in: path
      required: true
      description: The UUID of the assisted snapshot.
      schema:
        type: string
    ConsoleTokenParam:
      name: console_token
      in: path
      required: true
      description: The console auth token.
      schema:
        type: string
  schemas:
    FaultBody:
      type: object
      properties:
        code:
          type: integer
          description: HTTP status code of the error.
        message:
          type: string
        details:
          type: string
          description: Stack trace or extra detail; only present for some 5xx errors.
      required:
        - code
        - message
    Fault:
      type: object
      description: >-
        Nova error envelope. The single top-level key names the fault kind
        (badRequest, unauthorized, forbidden, itemNotFound, conflictingRequest,
        computeFault, …) and varies with the HTTP status.
      additionalProperties:
        $ref: '#/components/schemas/FaultBody'
      example:
        itemNotFound:
          code: 404
          message: Instance could not be found.
    AbsoluteLimits:
      type: object
      properties:
        maxServerGroupMembers:
          type: integer
        maxServerGroups:
          type: integer
        maxServerMeta:
          type: integer
        maxTotalCores:
          type: integer
        maxTotalInstances:
          type: integer
        maxTotalKeypairs:
          type: integer
        maxTotalRAMSize:
          type: integer
          description: RAM ceiling in MiB.
        totalCoresUsed:
          type: integer
        totalInstancesUsed:
          type: integer
        totalRAMUsed:
          type: integer
          description: RAM currently used in MiB.
        totalServerGroupsUsed:
          type: integer
      required:
        - maxServerGroupMembers
        - maxServerGroups
        - maxServerMeta
        - maxTotalCores
        - maxTotalInstances
        - maxTotalKeypairs
        - maxTotalRAMSize
        - totalCoresUsed
        - totalInstancesUsed
        - totalRAMUsed
        - totalServerGroupsUsed
      example:
        maxServerGroupMembers: 10
        maxServerGroups: 10
        maxServerMeta: 128
        maxTotalCores: 20
        maxTotalInstances: 10
        maxTotalKeypairs: 100
        maxTotalRAMSize: 51200
        totalCoresUsed: 2
        totalInstancesUsed: 1
        totalRAMUsed: 2048
        totalServerGroupsUsed: 0
    Limits:
      type: object
      properties:
        absolute:
          $ref: '#/components/schemas/AbsoluteLimits'
        rate:
          type: array
          description: Rate limits; always empty since rate limiting was removed from Nova.
          items:
            type: object
      required:
        - absolute
        - rate
    LimitsResponse:
      type: object
      properties:
        limits:
          $ref: '#/components/schemas/Limits'
      required:
        - limits
    Link:
      type: object
      properties:
        href:
          type: string
        rel:
          type: string
      required:
        - href
        - rel
      example:
        href: https://compute.example.com/v2.1/servers/6e0f6d0e-3f4a-4a54-8f3a-9a2f6d2b7f11
        rel: self
    NetworkAddress:
      type: object
      properties:
        addr:
          type: string
          description: The IP address.
        version:
          type: integer
          enum:
            - 4
            - 6
        'OS-EXT-IPS:type':
          type: string
          description: fixed or floating.
        'OS-EXT-IPS-MAC:mac_addr':
          type: string
      required:
        - addr
        - version
      example:
        addr: 10.0.0.4
        version: 4
        'OS-EXT-IPS:type': fixed
        'OS-EXT-IPS-MAC:mac_addr': 'fa:16:3e:8c:8b:1e'
    SecurityGroupRef:
      type: object
      description: A security group referenced by name.
      properties:
        name:
          type: string
      required:
        - name
    ImageRef:
      type: object
      properties:
        id:
          type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
      required:
        - id
    ServerImage:
      description: The server's boot image, or the empty string for boot-from-volume servers.
      oneOf:
        - $ref: '#/components/schemas/ImageRef'
        - type: string
          enum:
            - ''
    EmbeddedFlavor:
      type: object
      description: >-
        Flavor details embedded in server responses since 2.47 (there is no flavor
        id here; use original_name to correlate with /flavors).
      properties:
        vcpus:
          type: integer
        ram:
          type: integer
          description: RAM in MiB.
        disk:
          type: integer
          description: Root disk in GiB.
        ephemeral:
          type: integer
          description: Ephemeral disk in GiB.
        swap:
          type: integer
          description: Swap in MiB.
        original_name:
          type: string
          description: Name of the flavor the server was booted with.
        extra_specs:
          type: object
          additionalProperties:
            type: string
          description: Included subject to policy.
      required:
        - vcpus
        - ram
        - disk
        - ephemeral
        - swap
        - original_name
      example:
        vcpus: 2
        ram: 2048
        disk: 20
        ephemeral: 0
        swap: 0
        original_name: m1.small
    AttachedVolumeRef:
      type: object
      properties:
        id:
          type: string
          description: Volume id.
        delete_on_termination:
          type: boolean
      required:
        - id
    ServerFault:
      type: object
      description: Populated only for servers in ERROR or DELETED status, subject to policy for details.
      properties:
        code:
          type: integer
        created:
          type: string
          format: date-time
        message:
          type: string
        details:
          type: string
      required:
        - code
        - created
        - message
    Server:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
            - BUILD
            - DELETED
            - ERROR
            - HARD_REBOOT
            - MIGRATING
            - PASSWORD
            - PAUSED
            - REBOOT
            - REBUILD
            - RESCUE
            - RESIZE
            - REVERT_RESIZE
            - SHELVED
            - SHELVED_OFFLOADED
            - SHUTOFF
            - SOFT_DELETED
            - SUSPENDED
            - UNKNOWN
            - VERIFY_RESIZE
        tenant_id:
          type: string
        user_id:
          type: string
        created:
          type: string
          format: date-time
        updated:
          type:
            - string
            - 'null'
        hostId:
          type: string
          description: Obfuscated per-project id of the compute host; empty until scheduled.
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        flavor:
          $ref: '#/components/schemas/EmbeddedFlavor'
        image:
          $ref: '#/components/schemas/ServerImage'
        addresses:
          type: object
          description: IP addresses keyed by network name.
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/NetworkAddress'
        metadata:
          type: object
          additionalProperties:
            type: string
        accessIPv4:
          type: string
        accessIPv6:
          type: string
        key_name:
          type:
            - string
            - 'null'
        config_drive:
          type: string
          description: Empty string or "True".
        progress:
          type: integer
          description: Build/migration progress percentage; present during those operations.
        security_groups:
          type: array
          description: Absent when the server has no security groups.
          items:
            $ref: '#/components/schemas/SecurityGroupRef'
        fault:
          $ref: '#/components/schemas/ServerFault'
        host_status:
          type: string
          description: 'UP, DOWN, MAINTENANCE, UNKNOWN, or empty (policy-gated, 2.16+).'
        server_groups:
          type: array
          description: UUIDs of server groups the server belongs to (show/update responses, 2.71+).
          items:
            type: string
        trusted_image_certificates:
          type:
            - array
            - 'null'
          items:
            type: string
        'OS-DCF:diskConfig':
          type: string
          enum:
            - AUTO
            - MANUAL
        'OS-EXT-AZ:availability_zone':
          type: string
        'OS-EXT-STS:power_state':
          type: integer
          description: '0 NOSTATE, 1 RUNNING, 3 PAUSED, 4 SHUTDOWN, 6 CRASHED, 7 SUSPENDED.'
        'OS-EXT-STS:task_state':
          type:
            - string
            - 'null'
        'OS-EXT-STS:vm_state':
          type: string
        'OS-SRV-USG:launched_at':
          type:
            - string
            - 'null'
        'OS-SRV-USG:terminated_at':
          type:
            - string
            - 'null'
        'os-extended-volumes:volumes_attached':
          type: array
          items:
            $ref: '#/components/schemas/AttachedVolumeRef'
        'OS-EXT-SRV-ATTR:hostname':
          type: string
          description: Visible to non-admins since 2.90.
        'OS-EXT-SRV-ATTR:host':
          type:
            - string
            - 'null'
          description: Admin/policy only.
        'OS-EXT-SRV-ATTR:hypervisor_hostname':
          type:
            - string
            - 'null'
          description: Admin/policy only.
        'OS-EXT-SRV-ATTR:instance_name':
          type: string
          description: Admin/policy only.
        'OS-EXT-SRV-ATTR:reservation_id':
          type: string
          description: Admin/policy only (2.3+).
        'OS-EXT-SRV-ATTR:launch_index':
          type: integer
          description: Admin/policy only (2.3+).
        'OS-EXT-SRV-ATTR:kernel_id':
          type:
            - string
            - 'null'
          description: Admin/policy only (2.3+).
        'OS-EXT-SRV-ATTR:ramdisk_id':
          type:
            - string
            - 'null'
          description: Admin/policy only (2.3+).
        'OS-EXT-SRV-ATTR:root_device_name':
          type:
            - string
            - 'null'
          description: Admin/policy only (2.3+).
        'OS-EXT-SRV-ATTR:user_data':
          type:
            - string
            - 'null'
          description: Admin/policy only (2.3+), base64.
        locked:
          type: boolean
        locked_reason:
          type:
            - string
            - 'null'
        description:
          type:
            - string
            - 'null'
        tags:
          type: array
          items:
            type: string
        pinned_availability_zone:
          type:
            - string
            - 'null'
          description: Availability zone the server is pinned to, if any (2.96+).
      required:
        - id
        - name
        - status
        - tenant_id
        - user_id
        - created
        - updated
        - hostId
        - links
        - flavor
        - image
        - addresses
        - metadata
        - accessIPv4
        - accessIPv6
        - key_name
        - config_drive
        - 'OS-EXT-AZ:availability_zone'
        - 'OS-EXT-STS:power_state'
        - 'OS-EXT-STS:task_state'
        - 'OS-EXT-STS:vm_state'
        - 'OS-SRV-USG:launched_at'
        - 'OS-SRV-USG:terminated_at'
        - 'os-extended-volumes:volumes_attached'
        - locked
        - description
        - tags
        - locked_reason
        - pinned_availability_zone
      example:
        id: 6e0f6d0e-3f4a-4a54-8f3a-9a2f6d2b7f11
        name: web-1
        status: ACTIVE
        tenant_id: 5d45e7ca01d1455d99f64aff15894faf
        user_id: 32dd0b9998f5472f8ba190dc4d09a49f
        created: '2026-01-01T10:00:00Z'
        updated: '2026-01-02T10:00:00Z'
        hostId: 2091634baaccdc4c5a1d57069c833e402921df696b7f970791b12ec6
        links:
          - href: https://compute.example.com/v2.1/servers/6e0f6d0e-3f4a-4a54-8f3a-9a2f6d2b7f11
            rel: self
        flavor:
          vcpus: 2
          ram: 2048
          disk: 20
          ephemeral: 0
          swap: 0
          original_name: m1.small
        image:
          id: 70a599e0-31e7-49b7-b260-868f441e862b
        addresses:
          private:
            - addr: 10.0.0.4
              version: 4
              'OS-EXT-IPS:type': fixed
        metadata: {}
        accessIPv4: ''
        accessIPv6: ''
        key_name: default-key
        config_drive: ''
        'OS-DCF:diskConfig': AUTO
        'OS-EXT-AZ:availability_zone': nova
        'OS-EXT-STS:power_state': 1
        'OS-EXT-STS:task_state': null
        'OS-EXT-STS:vm_state': active
        'OS-SRV-USG:launched_at': '2026-01-01T10:01:00.000000'
        'OS-SRV-USG:terminated_at': null
        'os-extended-volumes:volumes_attached': []
        locked: false
        description: null
        tags: []
        locked_reason: null
        pinned_availability_zone: null
    ServerListItem:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
      required:
        - id
        - name
        - links
    ServersListResponse:
      type: object
      properties:
        servers:
          type: array
          items:
            $ref: '#/components/schemas/ServerListItem'
        servers_links:
          type: array
          description: Present when there is a next page; the href carries the next marker.
          items:
            $ref: '#/components/schemas/Link'
      required:
        - servers
    ServersDetailListResponse:
      type: object
      properties:
        servers:
          type: array
          items:
            $ref: '#/components/schemas/Server'
        servers_links:
          type: array
          description: Present when there is a next page; the href carries the next marker.
          items:
            $ref: '#/components/schemas/Link'
      required:
        - servers
    ServerResponse:
      type: object
      properties:
        server:
          $ref: '#/components/schemas/Server'
      required:
        - server
    NetworkRef:
      type: object
      description: One of uuid or port must be given.
      properties:
        uuid:
          type: string
          description: Network to attach to.
        port:
          type: string
          description: Existing Neutron port to attach.
        fixed_ip:
          type: string
          description: Fixed IPv4/IPv6 address to assign on the network.
        tag:
          type: string
          description: Device tag for the attached interface (2.42+).
    BlockDeviceMappingV2:
      type: object
      properties:
        source_type:
          type: string
          enum:
            - image
            - volume
            - snapshot
            - blank
        destination_type:
          type: string
          enum:
            - local
            - volume
        uuid:
          type: string
          description: Id of the image, volume, or snapshot named by source_type.
        boot_index:
          type:
            - integer
            - 'null'
          description: 0 for the boot device; -1 or null for non-boot devices.
        volume_size:
          type: integer
          description: Size in GiB when creating a new volume.
        volume_type:
          type: string
          description: Cinder volume type for a newly created volume (2.67+).
        delete_on_termination:
          type: boolean
        device_name:
          type: string
        disk_bus:
          type: string
        device_type:
          type: string
        guest_format:
          type: string
        no_device:
          type: boolean
        tag:
          type: string
          description: Device tag (2.32+).
      required:
        - source_type
    SchedulerHints:
      type: object
      description: Placement hints for the scheduler; a sibling of `server` in the create request.
      properties:
        group:
          type: string
          description: Server group UUID for affinity/anti-affinity placement.
        different_host:
          type: array
          items:
            type: string
        same_host:
          type: array
          items:
            type: string
        query:
          type: string
        build_near_host_ip:
          type: string
        cidr:
          type: string
      additionalProperties: true
    CreateServer:
      type: object
      properties:
        name:
          type: string
        flavorRef:
          type: string
        imageRef:
          type: string
          description: Required unless booting from a volume via block_device_mapping_v2.
        networks:
          description: >-
            Networks to attach, or the literal string "auto"/"none" to delegate to
            or bypass automatic allocation (2.37+).
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/NetworkRef'
            - type: string
              enum:
                - auto
                - none
        block_device_mapping_v2:
          type: array
          items:
            $ref: '#/components/schemas/BlockDeviceMappingV2'
        key_name:
          type: string
        security_groups:
          type: array
          items:
            $ref: '#/components/schemas/SecurityGroupRef'
        metadata:
          type: object
          additionalProperties:
            type: string
        user_data:
          type: string
          description: Base64-encoded configuration data for cloud-init.
        availability_zone:
          type: string
        adminPass:
          type: string
        config_drive:
          type: boolean
        min_count:
          type: integer
          minimum: 1
        max_count:
          type: integer
          minimum: 1
        return_reservation_id:
          type: boolean
          description: Return only a reservation id instead of the created server.
        description:
          type:
            - string
            - 'null'
          description: Server description (2.19+).
        tags:
          type: array
          description: Tags to set at boot (2.52+).
          items:
            type: string
        trusted_image_certificates:
          type: array
          description: Trusted certificate ids for image signature validation (2.63+).
          items:
            type: string
        hostname:
          type: string
          description: Hostname to set in the metadata service; FQDNs allowed since 2.94 (2.90+).
        host:
          type: string
          description: Requested compute host (admin, 2.74+).
        hypervisor_hostname:
          type: string
          description: Requested hypervisor (admin, 2.74+).
        'OS-DCF:diskConfig':
          type: string
          enum:
            - AUTO
            - MANUAL
