openapi: 3.1.0
info:
  title: OpenStack Compute API
  description: |-
    This is a reference for the OpenStack Compute API which is provided by the Nova
    project. To learn more about the OpenStack Compute API concepts, please refer to
    the [API guide](https://docs.openstack.org/api-guide/compute/index.html).

    All request and response schemas in this document describe the API at
    microversion 2.96 exactly: every request is assumed to carry the header
    `X-OpenStack-Nova-API-Version: 2.96` (or `OpenStack-API-Version: compute 2.96`).
    The header is intentionally not declared as a per-operation parameter; inject it
    as a constant in the HTTP client layer.

    Endpoints that are removed or rejected at microversion 2.96 are not described.
    This includes the network/image/volume proxy APIs removed at 2.36 (`/images`,
    `/os-networks`, `/os-tenant-networks`, `/os-fixed-ips`, floating-ip and
    security-group proxies, `/os-volumes`, `/os-snapshots`, `/os-baremetal-nodes`,
    `/os-fping`), `/os-hosts` (2.43), hypervisor `statistics`/`uptime`/`search`/
    `servers` sub-resources (2.53/2.88), legacy `/os-services/*` PUT actions (2.53),
    `/servers/{id}/os-virtual-interfaces` (2.44), groups removed from Nova entirely
    (cells, certificates, cloudpipe, consoles, agents), the frozen `/extensions`
    API, and `/servers/{id}/shares` (requires 2.97). Server actions rejected at
    2.96 (addFixedIp, addFloatingIp, os-getVNCConsole family, resetNetwork, …) are
    likewise omitted.
  version: '2.96'
servers:
  - url: 'https://{host}/v2.1'
    description: Nova endpoint. Project-scoped operations carry the project id as a path parameter on each request.
    variables:
      host:
        default: compute.example.com
tags:
  - name: versions
    description: API version discovery (served at the endpoint root, outside the versioned base URL).
  - name: servers
    description: Servers (instances) — list, create, show, update, delete.
  - name: server-actions
    description: Server actions posted to /servers/{server_id}/action (reboot, resize, rebuild, …).
  - name: remote-consoles
    description: Remote console access to servers (noVNC, SPICE, serial).
  - name: server-metadata
    description: Server metadata key/value pairs.
  - name: server-ips
    description: IP addresses assigned to a server, grouped by network.
  - name: server-tags
    description: Simple string tags on servers.
  - name: server-interfaces
    description: Network port interface attachments on servers (os-interface).
  - name: volume-attachments
    description: Volume attachments on servers (os-volume_attachments).
  - name: server-security-groups
    description: Security groups associated with a server (read-only at 2.96).
  - name: server-passwords
    description: Encrypted admin password set through the metadata service (os-server-password).
  - name: server-diagnostics
    description: Standardized server usage diagnostics from the hypervisor.
  - name: server-topology
    description: NUMA topology of a server.
  - name: instance-actions
    description: Audit log of actions performed on a server (os-instance-actions).
  - name: server-migrations
    description: In-progress live migrations of a server.
  - name: flavors
    description: Flavors — hardware configurations for servers.
  - name: flavor-extra-specs
    description: Flavor extra-spec key/value pairs.
  - name: flavor-access
    description: Per-tenant access to private flavors.
  - name: keypairs
    description: SSH and x509 keypairs (import only at 2.96 — generation was removed in 2.92).
  - name: limits
    description: Absolute limits (quota ceilings and current usage) for the project.
  - name: quota-sets
    description: Per-project (and per-user) compute quotas.
  - name: quota-class-sets
    description: Quota class defaults.
  - name: availability-zones
    description: Availability zone information.
  - name: aggregates
    description: Host aggregates (admin).
  - name: hypervisors
    description: Hypervisors (admin).
  - name: services
    description: Compute services and their state (admin).
  - name: server-groups
    description: Server groups with scheduler policies.
  - name: migrations
    description: Migration records across all servers (admin, os-migrations).
  - name: usage
    description: Simple tenant usage statistics (os-simple-tenant-usage).
  - name: audit-log
    description: Instance usage audit log (admin).
  - name: external-events
    description: External server events injected by other services (os-server-external-events).
  - name: assisted-volume-snapshots
    description: Hypervisor-assisted volume snapshots (Cinder-internal).
  - name: console-auth-tokens
    description: Console connection information for a console auth token (admin).
security:
  - novaAuth: []
paths:
  /nova/{project_id}/limits:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      operationId: getLimits
      tags:
        - limits
      summary: Show absolute limits
      description: >-
        Shows rate and absolute limits for the project. At microversion 2.96 the
        rate limits array is always empty; absolute limits carry quota ceilings
        (max*) and current usage (total*Used). Network-related limits were removed
        at 2.36 and injected-file/personality limits at 2.57.
      parameters:
        - name: tenant_id
          in: query
          required: false
          description: Project id to show limits for (admin only; defaults to the scoped project).
          schema:
            type: string
      responses:
        '200':
          description: Rate and absolute limits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitsResponse'
        default:
          $ref: '#/components/responses/Fault'
  /nova/{project_id}/servers:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      operationId: listServers
      tags:
        - servers
      summary: List servers
      description: >-
        Lists server ids, names, and links for servers visible to the caller.
        At 2.75+ unknown query parameters are rejected with 400.
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/MarkerParam'
        - $ref: '#/components/parameters/ChangesSinceParam'
        - $ref: '#/components/parameters/ChangesBeforeParam'
        - $ref: '#/components/parameters/AllTenantsParam'
        - $ref: '#/components/parameters/ServerSortKey'
        - $ref: '#/components/parameters/ServerSortDir'
        - $ref: '#/components/parameters/ServerFilterName'
        - $ref: '#/components/parameters/ServerFilterStatus'
        - $ref: '#/components/parameters/ServerFilterImage'
        - $ref: '#/components/parameters/ServerFilterFlavor'
        - $ref: '#/components/parameters/ServerFilterHost'
        - $ref: '#/components/parameters/ServerFilterIp'
        - $ref: '#/components/parameters/ServerFilterIp6'
        - $ref: '#/components/parameters/ServerFilterAvailabilityZone'
        - $ref: '#/components/parameters/ServerFilterConfigDrive'
        - $ref: '#/components/parameters/ServerFilterKeyName'
        - $ref: '#/components/parameters/ServerFilterCreatedAt'
        - $ref: '#/components/parameters/ServerFilterLaunchedAt'
        - $ref: '#/components/parameters/ServerFilterTerminatedAt'
        - $ref: '#/components/parameters/ServerFilterLocked'
        - $ref: '#/components/parameters/ServerFilterPowerState'
        - $ref: '#/components/parameters/ServerFilterProjectId'
        - $ref: '#/components/parameters/ServerFilterUserId'
        - $ref: '#/components/parameters/ServerFilterUuid'
        - $ref: '#/components/parameters/ServerFilterVmState'
        - $ref: '#/components/parameters/ServerFilterTaskState'
        - $ref: '#/components/parameters/ServerFilterHostname'
        - $ref: '#/components/parameters/ServerFilterReservationId'
        - $ref: '#/components/parameters/ServerFilterDeleted'
        - $ref: '#/components/parameters/ServerFilterTags'
        - $ref: '#/components/parameters/ServerFilterTagsAny'
        - $ref: '#/components/parameters/ServerFilterNotTags'
        - $ref: '#/components/parameters/ServerFilterNotTagsAny'
      responses:
        '200':
          description: Brief server list, with a pagination link when more results exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServersListResponse'
        default:
          $ref: '#/components/responses/Fault'
    post:
      operationId: createServer
      tags:
        - servers
      summary: Create server
      description: >-
        Creates one or more servers. `networks` is required at 2.96 and may be the
        literal string `auto` or `none` instead of a list. `personality` was removed
        at 2.57; pass configuration through `user_data` instead. Scheduler hints are
        a sibling of the `server` object, not nested inside it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServerRequest'
      responses:
        '202':
          description: >-
            Server creation accepted. Contains the new server's id and admin password
            unless `return_reservation_id` was requested, in which case only the
            reservation id is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateServerResponse'
        default:
          $ref: '#/components/responses/Fault'
  /nova/{project_id}/servers/detail:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      operationId: listServersDetail
      tags:
        - servers
      summary: List servers detailed
      description: >-
        Lists full server representations. Accepts the same filters as the brief
        list. At 2.96 responses include `pinned_availability_zone`.
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/MarkerParam'
        - $ref: '#/components/parameters/ChangesSinceParam'
        - $ref: '#/components/parameters/ChangesBeforeParam'
        - $ref: '#/components/parameters/AllTenantsParam'
        - $ref: '#/components/parameters/ServerSortKey'
        - $ref: '#/components/parameters/ServerSortDir'
        - $ref: '#/components/parameters/ServerFilterName'
        - $ref: '#/components/parameters/ServerFilterStatus'
        - $ref: '#/components/parameters/ServerFilterImage'
        - $ref: '#/components/parameters/ServerFilterFlavor'
        - $ref: '#/components/parameters/ServerFilterHost'
        - $ref: '#/components/parameters/ServerFilterIp'
        - $ref: '#/components/parameters/ServerFilterIp6'
        - $ref: '#/components/parameters/ServerFilterAvailabilityZone'
        - $ref: '#/components/parameters/ServerFilterConfigDrive'
        - $ref: '#/components/parameters/ServerFilterKeyName'
        - $ref: '#/components/parameters/ServerFilterCreatedAt'
        - $ref: '#/components/parameters/ServerFilterLaunchedAt'
        - $ref: '#/components/parameters/ServerFilterTerminatedAt'
        - $ref: '#/components/parameters/ServerFilterLocked'
        - $ref: '#/components/parameters/ServerFilterPowerState'
        - $ref: '#/components/parameters/ServerFilterProjectId'
        - $ref: '#/components/parameters/ServerFilterUserId'
        - $ref: '#/components/parameters/ServerFilterUuid'
        - $ref: '#/components/parameters/ServerFilterVmState'
        - $ref: '#/components/parameters/ServerFilterTaskState'
        - $ref: '#/components/parameters/ServerFilterHostname'
        - $ref: '#/components/parameters/ServerFilterReservationId'
        - $ref: '#/components/parameters/ServerFilterDeleted'
        - $ref: '#/components/parameters/ServerFilterTags'
        - $ref: '#/components/parameters/ServerFilterTagsAny'
        - $ref: '#/components/parameters/ServerFilterNotTags'
        - $ref: '#/components/parameters/ServerFilterNotTagsAny'
      responses:
        '200':
          description: Detailed server list, with a pagination link when more results exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServersDetailListResponse'
        default:
          $ref: '#/components/responses/Fault'
  /nova/{project_id}/servers/{server_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/ServerIdParam'
    get:
      operationId: getServer
      tags:
        - servers
      summary: Show server details
      description: Shows details for a server. At 2.96 the response includes `pinned_availability_zone`.
      responses:
        '200':
          description: The server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerResponse'
        default:
          $ref: '#/components/responses/Fault'
    put:
      operationId: updateServer
      tags:
        - servers
      summary: Update server
      description: >-
        Updates the server's name, description (2.19+), hostname (2.90+), access IPs,
        or disk config. Since 2.75 the response carries the same field set as show.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServerRequest'
      responses:
        '200':
          description: The updated server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerResponse'
        default:
          $ref: '#/components/responses/Fault'
    delete:
      operationId: deleteServer
      tags:
        - servers
      summary: Delete server
      description: >-
        Deletes a server. With deferred delete enabled the server enters
        SOFT_DELETED and can be restored with the `restore` action.
      responses:
        '204':
          description: Server deletion accepted.
        default:
          $ref: '#/components/responses/Fault'
  /nova/{project_id}/servers/{server_id}/action:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/ServerIdParam'
    post:
      operationId: performServerAction
      tags:
        - server-actions
      summary: Run a server action
      description: >-
        Runs one of the 32 server actions valid at microversion 2.96. The request
        body has exactly one top-level key naming the action. Most actions return
        202 with an empty body; `os-getConsoleOutput` and `rescue` return 200 with a
        body, `evacuate` returns 200 with an empty body, `createImage`/`createBackup`
        return 202 with the new image id (2.45+), `rebuild` returns 202 with the
        rebuilt server, and `confirmResize` returns 204.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerActionRequest'
      responses:
        '200':
          description: >-
            Synchronous action result: console output for `os-getConsoleOutput`, the
            admin password for `rescue`. `evacuate` also answers 200 but with an
            empty body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerActionSyncResponse'
        '202':
          description: >-
            Action accepted. The body is empty except for `createImage`/`createBackup`
            (image id, 2.45+) and `rebuild` (the rebuilt server).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerActionAcceptedResponse'
        '204':
          description: Resize confirmed (`confirmResize` only).
        default:
          $ref: '#/components/responses/Fault'
  /nova/{project_id}/servers/{server_id}/remote-consoles:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/ServerIdParam'
    post:
      operationId: createRemoteConsole
      tags:
        - remote-consoles
      summary: Create remote console
      description: >-
        Creates a console access URL for the server (2.6+). Valid protocol/type
        pairs at 2.96 are vnc/novnc, spice/spice-html5, serial/serial, and
        mks/webmks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRemoteConsoleRequest'
      responses:
        '200':
          description: The console URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteConsoleResponse'
        default:
          $ref: '#/components/responses/Fault'
  /nova/{project_id}/servers/{server_id}/metadata:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/ServerIdParam'
    get:
      operationId: getServerMetadata
      tags:
        - server-metadata
      summary: List server metadata
      description: Lists all metadata for the server.
      responses:
        '200':
          description: The metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerMetadataResponse'
        default:
          $ref: '#/components/responses/Fault'
    put:
      operationId: replaceServerMetadata
      tags:
        - server-metadata
      summary: Replace server metadata
      description: Replaces all metadata; keys not in the request are deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerMetadataResponse'
      responses:
        '200':
          description: The resulting metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerMetadataResponse'
        default:
          $ref: '#/components/responses/Fault'
    post:
      operationId: mergeServerMetadata
      tags:
        - server-metadata
      summary: Merge server metadata
      description: Creates or replaces the given keys; other keys are untouched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerMetadataResponse'
      responses:
        '200':
          description: The resulting metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerMetadataResponse'
        default:
          $ref: '#/components/responses/Fault'
  /nova/{project_id}/servers/{server_id}/metadata/{key}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/ServerIdParam'
      - $ref: '#/components/parameters/MetadataKeyParam'
    get:
      operationId: getServerMetadataItem
      tags:
        - server-metadata
      summary: Show a metadata item
      description: Shows one metadata key/value pair.
      responses:
        '200':
          description: The metadata item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerMetadataItemResponse'
        default:
          $ref: '#/components/responses/Fault'
    put:
      operationId: setServerMetadataItem
      tags:
        - server-metadata
      summary: Create or replace a metadata item
      description: Creates or replaces one metadata key; the body key must match the path key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerMetadataItemResponse'
      responses:
        '200':
          description: The metadata item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerMetadataItemResponse'
        default:
          $ref: '#/components/responses/Fault'
    delete:
      operationId: deleteServerMetadataItem
      tags:
        - server-metadata
      summary: Delete a metadata item
      description: Deletes one metadata key.
      responses:
        '204':
          description: Metadata item deleted.
        default:
          $ref: '#/components/responses/Fault'
  /nova/{project_id}/servers/{server_id}/ips:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/ServerIdParam'
    get:
      operationId: listServerIps
      tags:
        - server-ips
      summary: List server IP addresses
      description: Lists the server's IP addresses grouped by network. Does not include extension attributes.
      responses:
        '200':
          description: Addresses keyed by network name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerAddressesResponse'
        default:
          $ref: '#/components/responses/Fault'
  /nova/{project_id}/servers/{server_id}/ips/{network_label}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/ServerIdParam'
      - $ref: '#/components/parameters/NetworkLabelParam'
    get:
      operationId: getServerIpsByNetwork
      tags:
        - server-ips
      summary: Show server IP addresses for a network
      description: Lists the server's IP addresses on one network. The response is keyed by the network label.
      responses:
        '200':
          description: Addresses on the named network, keyed by its label.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkAddressesMap'
        default:
          $ref: '#/components/responses/Fault'
  /nova/{project_id}/servers/{server_id}/tags:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/ServerIdParam'
    get:
      operationId: listServerTags
      tags:
        - server-tags
      summary: List server tags
      description: Lists the server's tags (2.26+).
      responses:
        '200':
          description: The tags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerTags'
        default:
          $ref: '#/components/responses/Fault'
    put:
      operationId: replaceServerTags
      tags:
        - server-tags
      summary: Replace server tags
      description: Replaces the full tag set (max 50 tags, 2.26+).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerTags'
      responses:
        '200':
          description: The resulting tags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerTags'
        default:
          $ref: '#/components/responses/Fault'
    delete:
      operationId: deleteServerTags
      tags:
        - server-tags
      summary: Delete all server tags
      description: Removes every tag from the server (2.26+).
      responses:
        '204':
          description: Tags deleted.
        default:
          $ref: '#/components/responses/Fault'
  /nova/{project_id}/servers/{server_id}/tags/{tag}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/ServerIdParam'
      - $ref: '#/components/parameters/ServerTagParam'
    get:
      operationId: checkServerTag
      tags:
        - server-tags
      summary: Check tag existence
      description: Answers 204 when the server has the tag and 404 when it does not (2.26+).
      responses:
        '204':
          description: The server has the tag.
        default:
          $ref: '#/components/responses/Fault'
    put:
      operationId: addServerTag
      tags:
        - server-tags
      summary: Add a tag
      description: Adds a single tag to the server (2.26+). The request has no body.
      responses:
        '201':
          description: Tag added; the Location header points at the tag.
        '204':
          description: The server already had the tag.
        default:
          $ref: '#/components/responses/Fault'
    delete:
      operationId: deleteServerTag
      tags:
        - server-tags
      summary: Delete a tag
      description: Removes a single tag from the server (2.26+).
      responses:
        '204':
          description: Tag deleted.
        default:
          $ref: '#/components/responses/Fault'
  /nova/{project_id}/servers/{server_id}/os-interface:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/ServerIdParam'
    get:
      operationId: listServerInterfaces
      tags:
        - server-interfaces
      summary: List port interfaces
      description: Lists the server's attached port interfaces.
      responses:
        '200':
          description: The interface attachments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterfaceAttachmentsListResponse'
        default:
          $ref: '#/components/responses/Fault'
    post:
      operationId: createServerInterface
      tags:
        - server-interfaces
      summary: Attach a port interface
      description: >-
        Attaches an existing port or creates and attaches a port on the given
        network. Device tags are accepted since 2.49.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInterfaceAttachmentRequest'
      responses:
        '200':
          description: The new interface attachment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterfaceAttachmentResponse'
        default:
          $ref: '#/components/responses/Fault'
  /nova/{project_id}/servers/{server_id}/os-interface/{port_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/ServerIdParam'
      - $ref: '#/components/parameters/PortIdParam'
    get:
      operationId: getServerInterface
      tags:
        - server-interfaces
      summary: Show a port interface
      description: Shows one attached port interface. The response includes the device tag since 2.70.
      responses:
        '200':
          description: The interface attachment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterfaceAttachmentResponse'
        default:
          $ref: '#/components/responses/Fault'
    delete:
      operationId: deleteServerInterface
      tags:
        - server-interfaces
      summary: Detach a port interface
      description: Detaches the port from the server.
      responses:
        '202':
          description: Detachment accepted.
        default:
          $ref: '#/components/responses/Fault'
  /nova/{project_id}/servers/{server_id}/os-volume_attachments:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/ServerIdParam'
    get:
      operationId: listVolumeAttachments
      tags:
        - volume-attachments
      summary: List volume attachments
      description: >-
        Lists the server's volume attachments. Since 2.89 items carry
        `attachment_id` and `bdm_uuid` instead of `id`.
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - name: offset
          in: query
          required: false
          description: Number of items to skip.
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: The volume attachments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeAttachmentsListResponse'
        default:
