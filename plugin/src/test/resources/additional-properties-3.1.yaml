openapi: 3.1.0
info: {title: additionalProperties, version: '1'}
paths:
  /things:
    post:
      operationId: createThing
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Reached'}
      responses: {'204': {description: ok}}
components:
  schemas:
    # Referenced from the path, so swagger-parser's 3.1 dereferencer once treated it differently from the others.
    Reached:
      type: object
      properties:
        open: {$ref: '#/components/schemas/ReachedOpen'}
        inlineOpen: {type: object, additionalProperties: true}
    ReachedOpen: {type: object, additionalProperties: true}
    FreeForm: {type: object}
    Open: {type: object, additionalProperties: true}
    OpenSchema: {type: object, additionalProperties: {}}
    Closed: {type: object, additionalProperties: false}
    Strict: {type: object, properties: {id: {type: string}}, additionalProperties: false}
    StrictWithPatterns:
      type: object
      properties: {id: {type: string}}
      patternProperties: {'^x-': {type: string}}
      additionalProperties: false
    # Without additionalProperties, keys that match no pattern are allowed too, with any value.
    OpenWithPatterns:
      type: object
      properties: {id: {type: string}}
      patternProperties: {'^x-': {type: string}}
    SameWithPatterns:
      type: object
      properties: {id: {type: string}}
      patternProperties: {'^x-': {type: string}}
      additionalProperties: {type: string}
    MixedWithPatterns:
      type: object
      properties: {id: {type: string}}
      patternProperties: {'^x-': {type: string}, '^n-': {type: integer}}
      additionalProperties: false
    ForbiddenWithPatterns:
      type: object
      properties: {id: {type: string}}
      patternProperties: {'^x-': false}
      additionalProperties: false
    # Without properties, patternProperties share the map with additionalProperties as well.
    MapWithPatterns:
      type: object
      patternProperties: {'^x-': {type: string}}
      additionalProperties: false
    OpenMapWithPatterns:
      type: object
      patternProperties: {'^x-': {type: string}}
    MixedMapWithPatterns:
      type: object
      patternProperties: {'^x-': {type: string}}
      additionalProperties: {type: integer}
    WithExtras: {type: object, properties: {id: {type: string}}, additionalProperties: true}
    WithTypedExtras: {type: object, properties: {id: {type: string}}, additionalProperties: {type: integer}}
    # A required key that properties don't declare becomes a property with the schema that allows it (#121).
    RequiredExtra:
      type: object
      required: [tenant]
      properties: {id: {type: string}}
      additionalProperties: {type: string}
    RequiredExtraWithoutProperties:
      type: object
      required: [tenant]
      additionalProperties: {type: integer}
    RequiredExtraMatchingPattern:
      type: object
      required: [x-tenant, other]
      properties: {id: {type: string}}
      patternProperties: {'^x-': {type: string}}
      additionalProperties: {type: integer}
    RequiredExtraTwoMatches:
      type: object
      required: [x-n-tenant]
      patternProperties: {'^x-': {type: string}, 'n-': {type: integer}}
      additionalProperties: false
    RequiredExtraUnmatchedPattern:
      type: object
      required: [tenant]
      patternProperties: {'^x-': {type: string}}
    RequiredExtraForbidden:
      type: object
      required: [tenant, x-tenant]
      properties: {id: {type: string}}
      patternProperties: {'^x-': false}
      additionalProperties: false
    # A pattern the JVM can't compile may match, so the value is untyped.
    RequiredExtraUncompiled:
      type: object
      required: [x-tenant]
      properties: {id: {type: string}}
      patternProperties: {'^x-[^]*': {type: string}}
      additionalProperties: false
    # A key whose Kotlin name a property has is a property too, with a distinct Kotlin name (#129).
    RequiredExtraSameKotlinName:
      type: object
      required: [tenantId, tenant-id, tenant_id]
      properties: {tenant_id: {type: string}}
      additionalProperties: {type: string}
    # Patterns that all have `false` allow no other key either.
    RequiredExtraOnlyForbidden:
      type: object
      required: [tenant]
      properties: {id: {type: string}}
      patternProperties: {'^x-': false}
    # A key no pattern or additionalProperties allows is left to the schema that defines it.
    RequiredExtraComposed:
      allOf:
        - {type: object, properties: {tenant: {type: string}}}
        - {type: object, required: [tenant]}
    RequiredExtraOpen:
      type: object
      required: [tenant]
      properties: {id: {type: string}}
      additionalProperties: true
    RequiredExtraOpenSchema:
      type: object
      required: [tenant]
      properties: {id: {type: string}}
      additionalProperties: {}
    RequiredExtraInlineObject:
      type: object
      required: [tenant]
      properties: {id: {type: string}}
      additionalProperties: {type: object, properties: {name: {type: string}}}
    RequiredExtraRef:
      type: object
      required: [tenant]
      properties: {id: {type: string}}
      additionalProperties: {$ref: '#/components/schemas/Strict'}
