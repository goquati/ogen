        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptTransferRequest'
      responses:
        '202':
          description: Transfer accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        default:
          $ref: '#/components/responses/Fault'
  /cinder/{project_id}/os-quota-sets/{quota_project_id}:
