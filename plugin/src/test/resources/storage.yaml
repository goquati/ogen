      - $ref: '#/components/parameters/AttachmentIdParam'
    get:
      operationId: getAttachment
      tags:
        - attachments
      summary: Show attachment details
      description: Shows details for an attachment (3.27+).
      responses:
        '200':
          description: The attachment.
          content:
            application/json:
              schema:
