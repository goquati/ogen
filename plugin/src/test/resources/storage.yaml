      tags:
        - attachments
      summary: List attachments
      description: Lists brief attachment representations visible to the caller (3.27+).
      parameters:
        - $ref: '#/components/parameters/AllTenantsParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
        - $ref: '#/components/parameters/MarkerParam'
        - $ref: '#/components/parameters/AttachmentFilterInstanceId'
        - $ref: '#/components/parameters/AttachmentFilterVolumeId'
