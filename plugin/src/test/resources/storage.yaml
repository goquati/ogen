              type: string
            force:
              type: boolean
              description: Upload even when the volume is attached.
            disk_format:
              type: string
              description: Defaults to raw.
            container_format:
              type: string
              description: Defaults to bare.
            visibility:
              type: string
              description: Image visibility (3.1+); defaults to private.
            protected:
              type: boolean
              description: Whether the image is delete-protected (3.1+).
