          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaClassSetResponse'
        default:
          $ref: '#/components/responses/Fault'
    put:
      operationId: updateQuotaClassSet
      tags:
        - quota-class-sets
      summary: Update quota class
      description: Creates or updates quotas of a quota class (admin).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQuotaClassSetRequest'
      responses:
        '200':
          description: The updated quota class.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaClassSetResponse'
        default:
          $ref: '#/components/responses/Fault'
  /cinder/{project_id}/os-availability-zone:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      operationId: listAvailabilityZones
      tags:
        - availability-zones
      summary: List availability zones
      description: Lists availability zone names and states.
      responses:
        '200':
          description: The availability zones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityZonesListResponse'
        default:
          $ref: '#/components/responses/Fault'
  /cinder/{project_id}/os-services:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      operationId: listServices
      tags:
        - services
      summary: List block storage services
      description: >-
        Lists block storage services and their state (admin). Includes `cluster`
        since 3.7 and `backend_state` since 3.49.
      parameters:
        - name: binary
          in: query
          required: false
          description: Filter by service binary, e.g. cinder-volume.
          schema:
            type: string
        - name: host
          in: query
          required: false
          description: Filter by host name.
          schema:
            type: string
      responses:
        '200':
          description: The services.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicesListResponse'
        default:
          $ref: '#/components/responses/Fault'
  /cinder/{project_id}/os-services/{service_action}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/ServiceActionParam'
    put:
      operationId: performServiceAction
      tags:
        - services
      summary: Run a service action
      description: >-
        Enables or disables a service, freezes or thaws a cinder-volume backend,
        fails a replicating backend over (`failover_host`), or gets/sets service
        log levels (`get-log`/`set-log`, 3.32+) (admin). The relevant body fields
        depend on the action named in the path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceActionRequest'
      responses:
        '200':
          description: >-
            Action result. enable/disable echo the service's host, binary, and
            status; get-log returns the current log levels; the rest answer with
            an empty object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceActionResponse'
        default:
          $ref: '#/components/responses/Fault'
  /cinder/{project_id}/manageable_volumes:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      operationId: listManageableVolumes
      tags:
        - manageable-volumes
      summary: List manageable volumes
      description: >-
        Lists backend volumes that Cinder does not yet manage (admin, 3.8+). One of
        `host` or `cluster` (3.17+) is required.
      parameters:
        - $ref: '#/components/parameters/ManageHostParam'
        - $ref: '#/components/parameters/ManageClusterParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
        - $ref: '#/components/parameters/MarkerParam'
      responses:
        '200':
          description: Brief manageable volume list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManageableVolumesListResponse'
        default:
          $ref: '#/components/responses/Fault'
    post:
      operationId: manageVolume
      tags:
        - manageable-volumes
      summary: Manage an existing volume
      description: >-
        Adopts an existing backend volume, identified by `ref`, into Cinder
        management (admin, 3.8+; before 3.8 this was /os-volume-manage).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManageVolumeRequest'
      responses:
        '202':
          description: Manage accepted; the volume is returned in `creating` status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeResponse'
        default:
          $ref: '#/components/responses/Fault'
  /cinder/{project_id}/manageable_volumes/detail:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      operationId: listManageableVolumesDetail
      tags:
        - manageable-volumes
      summary: List manageable volumes detailed
      description: >-
        Lists backend volumes that Cinder does not yet manage, with safety reasons
        and extra backend info (admin, 3.8+).
      parameters:
        - $ref: '#/components/parameters/ManageHostParam'
        - $ref: '#/components/parameters/ManageClusterParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
        - $ref: '#/components/parameters/MarkerParam'
      responses:
        '200':
          description: Detailed manageable volume list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManageableVolumesDetailListResponse'
        default:
          $ref: '#/components/responses/Fault'
  /cinder/{project_id}/manageable_snapshots:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      operationId: listManageableSnapshots
      tags:
        - manageable-snapshots
      summary: List manageable snapshots
      description: >-
        Lists backend snapshots that Cinder does not yet manage (admin, 3.8+). One
        of `host` or `cluster` (3.17+) is required.
      parameters:
        - $ref: '#/components/parameters/ManageHostParam'
        - $ref: '#/components/parameters/ManageClusterParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
        - $ref: '#/components/parameters/MarkerParam'
      responses:
        '200':
          description: Brief manageable snapshot list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManageableSnapshotsListResponse'
        default:
          $ref: '#/components/responses/Fault'
    post:
      operationId: manageSnapshot
      tags:
        - manageable-snapshots
      summary: Manage an existing snapshot
      description: >-
        Adopts an existing backend snapshot of a managed volume, identified by
        `ref`, into Cinder management (admin, 3.8+).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManageSnapshotRequest'
      responses:
        '202':
          description: Manage accepted; the snapshot is returned in `creating` status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotResponse'
        default:
          $ref: '#/components/responses/Fault'
  /cinder/{project_id}/manageable_snapshots/detail:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      operationId: listManageableSnapshotsDetail
      tags:
        - manageable-snapshots
      summary: List manageable snapshots detailed
      description: >-
        Lists backend snapshots that Cinder does not yet manage, with safety
        reasons and extra backend info (admin, 3.8+).
      parameters:
        - $ref: '#/components/parameters/ManageHostParam'
        - $ref: '#/components/parameters/ManageClusterParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
        - $ref: '#/components/parameters/MarkerParam'
      responses:
        '200':
          description: Detailed manageable snapshot list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManageableSnapshotsDetailListResponse'
        default:
          $ref: '#/components/responses/Fault'
  /cinder/{project_id}/messages:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      operationId: listMessages
      tags:
        - messages
      summary: List messages
      description: >-
        Lists user-facing fault messages for asynchronous failures in the project
        (3.3+). Paginated and sortable since 3.5.
      parameters:
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
        - $ref: '#/components/parameters/MarkerParam'
      responses:
        '200':
          description: The messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagesListResponse'
        default:
          $ref: '#/components/responses/Fault'
  /cinder/{project_id}/messages/{message_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/MessageIdParam'
    get:
      operationId: getMessage
      tags:
        - messages
      summary: Show message details
      description: Shows details for a fault message (3.3+).
      responses:
        '200':
          description: The message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        default:
          $ref: '#/components/responses/Fault'
    delete:
      operationId: deleteMessage
      tags:
        - messages
      summary: Delete message
      description: Deletes a fault message (3.3+). Messages also expire on their own after a period.
      responses:
        '204':
          description: Message deleted.
        default:
          $ref: '#/components/responses/Fault'
  /cinder/{project_id}/resource_filters:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      operationId: listResourceFilters
      tags:
        - resource-filters
      summary: List resource filters
      description: Lists the query filter keys the deployment accepts per resource (3.33+).
      parameters:
        - name: resource
          in: query
          required: false
          description: Only show filters for this resource, e.g. volume.
          schema:
            type: string
      responses:
        '200':
          description: The resource filters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceFiltersListResponse'
        default:
          $ref: '#/components/responses/Fault'
  /cinder/default-types:
    get:
      operationId: listDefaultTypes
      tags:
        - default-types
      summary: List default volume type overrides
      description: >-
        Lists every project's default volume type override (admin, 3.62+). This
        API is served without a project prefix.
      responses:
        '200':
          description: The default type overrides.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultTypesListResponse'
        default:
          $ref: '#/components/responses/Fault'
  /cinder/default-types/{target_project_id}:
    parameters:
      - $ref: '#/components/parameters/TargetProjectIdParam'
    get:
      operationId: getDefaultTypeOverride
      tags:
        - default-types
      summary: Show a default volume type override
      description: Shows the default volume type override of a project (admin, 3.62+).
      responses:
        '200':
          description: The default type override.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultTypeResponse'
        default:
          $ref: '#/components/responses/Fault'
    put:
      operationId: setDefaultTypeOverride
      tags:
        - default-types
      summary: Set a default volume type override
      description: Creates or updates the default volume type override of a project (admin, 3.62+).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetDefaultTypeRequest'
      responses:
        '200':
          description: The default type override.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultTypeResponse'
        default:
          $ref: '#/components/responses/Fault'
    delete:
      operationId: deleteDefaultTypeOverride
      tags:
        - default-types
      summary: Unset a default volume type override
      description: Removes the default volume type override of a project (admin, 3.62+).
      responses:
        '204':
          description: Override removed.
        default:
          $ref: '#/components/responses/Fault'
  /:
    servers:
      - url: 'https://{host}'
        description: Endpoint root, outside the versioned base URL.
        variables:
          host:
            default: storage.example.com
    get:
      operationId: listVersions
      tags:
        - versions
      summary: List API versions
      description: Lists the major API versions the endpoint serves. Needs no authentication.
      security: []
      responses:
        '200':
          description: The available versions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionsListResponse'
        default:
          $ref: '#/components/responses/Fault'
  /v3:
    servers:
      - url: 'https://{host}'
        description: Endpoint root, outside the versioned base URL.
        variables:
          host:
            default: storage.example.com
    get:
      operationId: getV3VersionDetails
      tags:
        - versions
      summary: Show v3 version details
      description: Shows the v3 API version document, including the supported microversion range.
      security: []
      responses:
        '200':
          description: The version document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
        default:
          $ref: '#/components/responses/Fault'
components:
  securitySchemes:
    cinderAuth:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: A valid Keystone authentication token.
  parameters:
    ProjectIdParam:
      name: project_id
      in: path
      required: true
      description: Keystone project (tenant) id that scopes this request.
      schema:
        type: string
    VolumeIdParam:
      name: volume_id
      in: path
      required: true
      description: The UUID of the volume.
      schema:
        type: string
    SnapshotIdParam:
      name: snapshot_id
      in: path
      required: true
      description: The UUID of the snapshot.
      schema:
        type: string
    BackupIdParam:
      name: backup_id
      in: path
      required: true
      description: The UUID of the backup.
      schema:
        type: string
    AttachmentIdParam:
      name: attachment_id
      in: path
      required: true
      description: The UUID of the attachment.
      schema:
        type: string
    VolumeTypeIdParam:
      name: volume_type_id
      in: path
      required: true
      description: The id of the volume type.
      schema:
        type: string
    EncryptionIdParam:
      name: encryption_id
      in: path
      required: true
      description: >-
        The id of the encryption type configuration (PUT/DELETE), or the spec key
        name to show (GET).
      schema:
        type: string
    ExtraSpecKeyParam:
      name: key
      in: path
      required: true
      description: The extra spec key name.
      schema:
        type: string
    GroupTypeIdParam:
      name: group_type_id
      in: path
      required: true
      description: The id of the group type.
      schema:
        type: string
    GroupSpecKeyParam:
      name: key
      in: path
      required: true
      description: The group spec key name.
      schema:
        type: string
    GroupIdParam:
      name: group_id
      in: path
      required: true
      description: The UUID of the group.
      schema:
        type: string
    GroupSnapshotIdParam:
      name: group_snapshot_id
      in: path
      required: true
      description: The UUID of the group snapshot.
      schema:
        type: string
    QosSpecsIdParam:
      name: qos_id
      in: path
      required: true
      description: The id of the QoS specification.
      schema:
        type: string
    QosVolTypeIdParam:
      name: vol_type_id
      in: query
      required: true
      description: The id of the volume type to (dis)associate.
      schema:
        type: string
    TransferIdParam:
      name: transfer_id
      in: path
      required: true
      description: The UUID of the volume transfer.
      schema:
        type: string
    QuotaProjectIdParam:
      name: quota_project_id
      in: path
      required: true
      description: The id of the project whose quotas are addressed.
      schema:
        type: string
    QuotaClassIdParam:
      name: quota_class_id
      in: path
      required: true
      description: The name of the quota class; Cinder only uses `default`.
      schema:
        type: string
    MessageIdParam:
      name: message_id
      in: path
      required: true
      description: The UUID of the message.
      schema:
        type: string
    MetadataKeyParam:
      name: key
      in: path
      required: true
      description: The metadata key.
      schema:
        type: string
    TargetProjectIdParam:
      name: target_project_id
      in: path
      required: true
      description: The id of the project whose default volume type is addressed.
      schema:
        type: string
    ServiceActionParam:
      name: service_action
      in: path
      required: true
      description: The service action to run.
      schema:
        type: string
        enum:
          - enable
          - disable
          - disable-log-reason
          - freeze
          - thaw
          - failover_host
          - set-log
          - get-log
    LimitParam:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return. Capped by the deployment's osapi_max_limit.
      schema:
        type: integer
        minimum: 0
    OffsetParam:
      name: offset
      in: query
      required: false
      description: Number of items to skip.
      schema:
        type: integer
        minimum: 0
    MarkerParam:
      name: marker
      in: query
      required: false
      description: The id of the last item on the previous page; the listing starts after it.
      schema:
        type: string
    SortParam:
      name: sort
      in: query
      required: false
      description: >-
        Comma-separated list of sort keys with optional :asc/:desc direction
        suffixes, e.g. `created_at:desc,id`. Defaults to created_at:desc.
      schema:
        type: string
    AllTenantsParam:
      name: all_tenants
      in: query
      required: false
      description: List items across all projects (admin).
      schema:
        type: boolean
    WithCountParam:
      name: with_count
      in: query
      required: false
      description: Include the total item count in the response (3.45+).
      schema:
        type: boolean
    CreatedAtFilterParam:
      name: created_at
      in: query
      required: false
      description: >-
        Filter by creation time using comparison operators, e.g.
        `gt:2023-01-01T00:00:00` (3.60+). Operators are lt, lte, gt, gte, eq, neq.
      schema:
        type: string
    UpdatedAtFilterParam:
      name: updated_at
      in: query
      required: false
      description: Filter by last update time using comparison operators (3.60+).
      schema:
        type: string
    ConsumesQuotaFilterParam:
      name: consumes_quota
      in: query
      required: false
      description: Filter by whether the resource counts against quota (3.65+).
      schema:
        type: boolean
    VolumeFilterName:
      name: name
      in: query
      required: false
      description: Filter by volume name. Inexact matching with `name~` is available since 3.34.
      schema:
        type: string
    VolumeFilterStatus:
      name: status
      in: query
      required: false
      description: Filter by volume status (e.g. available, in-use, error).
      schema:
        type: string
    VolumeFilterBootable:
      name: bootable
      in: query
      required: false
      description: Filter by bootable flag.
      schema:
        type: boolean
    VolumeFilterMetadata:
      name: metadata
      in: query
      required: false
      description: 'Filter by metadata key/value pairs, JSON-encoded: {"key": "value"}.'
      schema:
        type: string
    VolumeFilterMigrationStatus:
      name: migration_status
      in: query
      required: false
      description: Filter by migration status (admin).
      schema:
        type: string
    SnapshotFilterName:
      name: name
      in: query
      required: false
      description: Filter by snapshot name.
      schema:
        type: string
    SnapshotFilterStatus:
      name: status
      in: query
      required: false
      description: Filter by snapshot status.
      schema:
        type: string
    SnapshotFilterVolumeId:
      name: volume_id
      in: query
      required: false
      description: Filter by source volume id.
      schema:
        type: string
    BackupFilterName:
      name: name
      in: query
      required: false
      description: Filter by backup name.
      schema:
        type: string
    BackupFilterStatus:
      name: status
      in: query
      required: false
      description: Filter by backup status.
      schema:
        type: string
    BackupFilterVolumeId:
      name: volume_id
      in: query
      required: false
      description: Filter by source volume id.
      schema:
        type: string
    AttachmentFilterInstanceId:
      name: instance_id
      in: query
      required: false
      description: Filter by attached instance id.
      schema:
        type: string
    AttachmentFilterVolumeId:
      name: volume_id
      in: query
      required: false
      description: Filter by volume id.
      schema:
        type: string
    AttachmentFilterStatus:
      name: status
      in: query
      required: false
      description: Filter by attachment status.
      schema:
        type: string
    GroupListVolumeParam:
      name: list_volume
      in: query
      required: false
      description: Embed the ids of member volumes in each group (3.25+).
      schema:
        type: boolean
    ManageHostParam:
      name: host
      in: query
      required: false
      description: Cinder host to list backend resources for, in host@backend#pool syntax.
      schema:
        type: string
    ManageClusterParam:
      name: cluster
      in: query
      required: false
      description: Cinder cluster to list backend resources for (3.17+).
      schema:
        type: string
  schemas:
    FaultBody:
      type: object
      properties:
        code:
          type: integer
          description: HTTP status code of the error.
        message:
          type: string
        details:
          type: string
          description: Stack trace or extra detail; only present for some 5xx errors.
      required:
        - code
        - message
    Fault:
      type: object
      description: >-
        Cinder error envelope. The single top-level key names the fault kind
        (badRequest, unauthorized, forbidden, itemNotFound, conflictingRequest,
        overLimit, …) and varies with the HTTP status.
      additionalProperties:
        $ref: '#/components/schemas/FaultBody'
      example:
        itemNotFound:
          code: 404
          message: Volume could not be found.
    AbsoluteLimits:
      type: object
      properties:
        maxTotalVolumes:
          type: integer
        maxTotalSnapshots:
          type: integer
        maxTotalVolumeGigabytes:
          type: integer
          description: Combined volume/snapshot size ceiling in GiB.
        maxTotalBackups:
          type: integer
        maxTotalBackupGigabytes:
          type: integer
        totalVolumesUsed:
          type: integer
        totalSnapshotsUsed:
          type: integer
        totalGigabytesUsed:
          type: integer
        totalBackupsUsed:
          type: integer
        totalBackupGigabytesUsed:
          type: integer
      required:
        - maxTotalVolumes
        - maxTotalSnapshots
        - maxTotalVolumeGigabytes
        - maxTotalBackups
        - maxTotalBackupGigabytes
        - totalVolumesUsed
        - totalSnapshotsUsed
        - totalGigabytesUsed
        - totalBackupsUsed
        - totalBackupGigabytesUsed
      example:
        maxTotalVolumes: 10
        maxTotalSnapshots: 10
        maxTotalVolumeGigabytes: 1000
        maxTotalBackups: 10
        maxTotalBackupGigabytes: 1000
        totalVolumesUsed: 2
        totalSnapshotsUsed: 1
        totalGigabytesUsed: 40
        totalBackupsUsed: 0
        totalBackupGigabytesUsed: 0
    Limits:
      type: object
      properties:
        absolute:
          $ref: '#/components/schemas/AbsoluteLimits'
        rate:
          type: array
          description: Rate limits; always empty since rate limiting was removed from Cinder.
          items:
            type: object
      required:
        - absolute
        - rate
    LimitsResponse:
      type: object
      properties:
        limits:
          $ref: '#/components/schemas/Limits'
      required:
        - limits
    Link:
      type: object
      properties:
        href:
          type: string
        rel:
          type: string
      required:
        - href
        - rel
      example:
        href: https://storage.example.com/v3/volumes/2b955850-f177-45f7-9f49-ecb2c256d161
        rel: self
    VolumeStatus:
      type: string
      description: The lifecycle status of a volume.
      enum:
        - creating
        - available
        - reserved
        - attaching
        - detaching
        - in-use
        - maintenance
        - deleting
        - awaiting-transfer
        - error
        - error_deleting
        - backing-up
        - restoring-backup
        - error_backing-up
        - error_restoring
        - error_extending
        - error_managing
        - managing
        - downloading
        - uploading
        - retyping
        - extending
    VolumeAttachmentInfo:
      type: object
      description: One attachment of the volume to a server or host.
      properties:
        attachment_id:
          type: string
          description: The id of the attachment record.
        attached_at:
          type:
            - string
            - 'null'
          format: date-time
        device:
