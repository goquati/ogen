    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      operationId: listVolumeTransfersDetail
      tags:
        - volume-transfers
      summary: List volume transfers detailed
      description: >-
        Lists full transfer representations (3.55+). Includes `source_project_id`,
        `destination_project_id`, and `accepted` since 3.57.
      parameters:
        - $ref: '#/components/parameters/AllTenantsParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
        - $ref: '#/components/parameters/MarkerParam'
      responses:
        '200':
          description: Detailed transfer list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransfersDetailListResponse'
        default:
          $ref: '#/components/responses/Fault'
  /cinder/{project_id}/volume-transfers/{transfer_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/TransferIdParam'
    get:
      operationId: getVolumeTransfer
      tags:
        - volume-transfers
      summary: Show volume transfer details
      description: Shows details for a pending transfer (3.55+).
      responses:
        '200':
          description: The transfer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        default:
          $ref: '#/components/responses/Fault'
    delete:
      operationId: deleteVolumeTransfer
      tags:
        - volume-transfers
      summary: Cancel volume transfer
      description: Cancels a pending transfer; the volume returns to `available` (3.55+).
