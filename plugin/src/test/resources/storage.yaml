        backup_id:
          type:
            - string
            - 'null'
          description: Id of the backup the volume was restored from (3.47+).
        bootable:
          type: string
          description: Whether the volume is bootable, as the string "true" or "false".
          enum:
            - 'true'
            - 'false'
        encrypted:
          type: boolean
        multiattach:
          type: boolean
        metadata:
          type: object
          additionalProperties:
            type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        user_id:
          type: string
        migration_status:
          type:
            - string
            - 'null'
          description: Status of an ongoing volume migration (admin).
        replication_status:
          type:
            - string
            - 'null'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/VolumeAttachmentInfo'
