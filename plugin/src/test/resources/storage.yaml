          type:
            - string
            - 'null'
          description: Backend id serving after a failover (cinder-volume only).
        frozen:
          type: boolean
          description: Whether the backend rejects state-changing operations (cinder-volume only).
        backend_state:
          type: string
          description: up or down (cinder-volume only, 3.49+).
