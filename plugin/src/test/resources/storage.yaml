          description: Minimum supported microversion.
        updated:
          type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
      required:
        - id
        - status
        - version
        - min_version
        - updated
        - links
      example:
        id: v3.0
        status: CURRENT
        version: '3.70'
        min_version: '3.0'
        updated: '2022-08-31T00:00:00Z'
        links:
          - href: https://storage.example.com/v3/
            rel: self
    VersionsListResponse:
      type: object
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/ApiVersion'
      required:
        - versions
    ApiVersionDetail:
      allOf:
        - $ref: '#/components/schemas/ApiVersion'
        - type: object
          properties:
            media-types:
              type: array
              items:
                type: object
                properties:
                  base:
                    type: string
                  type:
                    type: string
                required:
                  - base
                  - type
          required:
            - media-types
    VersionResponse:
      type: object
      properties:
        versions:
          type: array
          description: Cinder wraps the single version document in a list.
          items:
            $ref: '#/components/schemas/ApiVersionDetail'
      required:
        - versions
  responses:
    Fault:
      description: Cinder error (4xx/5xx). The envelope key names the fault kind.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Fault'
