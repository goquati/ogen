                $ref: '#/components/schemas/GroupsListResponse'
        default:
          $ref: '#/components/responses/Fault'
    post:
      operationId: createGroup
      tags:
        - groups
      summary: Create group
      description: Creates a group of the given group type, restricted to the given volume types (3.13+).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '202':
          description: Group creation accepted; contains the new group's id and name.
