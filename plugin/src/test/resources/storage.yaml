  /cinder/{project_id}/qos-specs/{qos_id}/disassociate:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/QosSpecsIdParam'
    get:
      operationId: disassociateQosSpecs
      tags:
        - qos-specs
      summary: Disassociate QoS specs from a volume type
      description: >-
        Disassociates the QoS specification from the volume type given in
        `vol_type_id` (admin). Despite being a state change, the API uses GET.
      parameters:
        - $ref: '#/components/parameters/QosVolTypeIdParam'
      responses:
        '202':
