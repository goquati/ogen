      type: object
      description: >-
        Fields relevant to the action named in the path: enable/disable take host
        and binary; disable-log-reason adds disabled_reason; freeze/thaw take host;
        failover_host takes host and backend_id; set-log/get-log take server,
        prefix, and level.
      properties:
        host:
          type: string
        binary:
          type: string
        cluster:
          type:
            - string
            - 'null'
          description: Address a cluster instead of a host (3.26+; freeze/thaw/failover).
        disabled_reason:
          type: string
        backend_id:
          type: string
          description: Replication target to fail over to.
        server:
          type: string
          description: Host or binary to get/set log levels for.
        prefix:
          type: string
          description: Logger name prefix filter.
        level:
          type: string
          description: Log level, e.g. DEBUG, INFO, WARNING, ERROR.
    ServiceActionResponse:
      type: object
      description: >-
        Action result. enable/disable echo host, binary, and the new status;
        disable-log-reason adds disabled_reason; get-log returns log_levels; the
        other actions answer with an empty object.
      additionalProperties: true
