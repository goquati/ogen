openapi: 3.1.0
info:
  title: OpenStack Block Storage API
  description: |-
    This is a reference for the OpenStack Block Storage API which is provided by the
    Cinder project. To learn more about the OpenStack Block Storage API concepts,
    please refer to the [API guide](https://docs.openstack.org/api-guide/block-storage/index.html).

    All request and response schemas in this document describe the API at
    microversion 3.70 exactly: every request is assumed to carry the header
    `OpenStack-API-Version: volume 3.70`. The header is intentionally not declared
    as a per-operation parameter; inject it as a constant in the HTTP client layer.

    Deprecated and superseded endpoint groups are not described. This includes the
    consistency-group APIs (`/consistencygroups`, `/cgsnapshots`) superseded by
    generic groups (3.13/3.14), the legacy transfer route `/os-volume-transfer`
    superseded by `/volume-transfers` (3.55), the legacy manage extensions
    `/os-volume-manage` and `/os-snapshot-manage` superseded by
    `/manageable_volumes` and `/manageable_snapshots` (3.8), the frozen
    `/extensions` API, and the operator-only `/os-hosts`, `/clusters`, and
    `/workers` APIs.
  version: '3.70'
servers:
  - url: 'https://{host}/v3'
    description: Cinder endpoint. Project-scoped operations carry the project id as a path parameter on each request.
    variables:
      host:
        default: storage.example.com
tags:
  - name: versions
    description: API version discovery (served at the endpoint root, outside the versioned base URL).
  - name: limits
    description: Absolute limits (quota ceilings and current usage) for the project.
  - name: volumes
    description: Volumes — list, create, show, update, delete, summary.
  - name: volume-actions
    description: Volume actions posted to /volumes/{volume_id}/action (extend, retype, upload-to-image, …).
  - name: volume-metadata
    description: Volume metadata key/value pairs.
  - name: snapshots
    description: Volume snapshots — list, create, show, update, delete.
  - name: snapshot-actions
    description: Snapshot actions posted to /snapshots/{snapshot_id}/action (reset status, force delete, …).
  - name: snapshot-metadata
    description: Snapshot metadata key/value pairs.
  - name: backups
    description: Volume backups — list, create, show, update, delete, restore.
  - name: backup-actions
    description: Backup actions posted to /backups/{backup_id}/action (admin).
  - name: backup-records
    description: Backup record export/import for cross-deployment restore (admin).
  - name: attachments
    description: Volume attachments (3.27+) — the modern attach/detach workflow used by Nova.
  - name: volume-types
    description: Volume types — storage backend profiles for volumes.
  - name: volume-type-extra-specs
    description: Volume type extra-spec key/value pairs (admin).
  - name: volume-type-encryption
    description: Encryption type configuration on volume types (admin).
  - name: volume-type-access
    description: Per-project access to private volume types (admin).
  - name: group-types
    description: Group types — profiles for volume groups.
  - name: group-type-specs
    description: Group type spec key/value pairs (admin).
  - name: groups
    description: Generic volume groups (3.13+) — replaces consistency groups.
  - name: group-actions
    description: Group actions posted to /groups/{group_id}/action (delete, reset status, replication).
  - name: group-snapshots
    description: Group snapshots (3.14+) — point-in-time snapshots of all volumes in a group.
  - name: qos-specs
    description: Quality-of-service specifications and their volume type associations (admin).
  - name: volume-transfers
    description: Volume ownership transfers between projects (/volume-transfers, 3.55+).
  - name: quota-sets
    description: Per-project block storage quotas.
  - name: quota-class-sets
    description: Quota class defaults (admin).
  - name: availability-zones
    description: Availability zone information.
  - name: services
    description: Block storage services and their state (admin).
  - name: manageable-volumes
    description: Listing and adopting backend volumes not yet managed by Cinder (admin, 3.8+).
  - name: manageable-snapshots
    description: Listing and adopting backend snapshots not yet managed by Cinder (admin, 3.8+).
  - name: messages
    description: User-facing fault messages for asynchronous failures (3.3+).
  - name: resource-filters
    description: Query filters valid per resource for the deployment (3.33+).
  - name: default-types
    description: Per-project default volume type overrides (admin, 3.62+).
security:
  - cinderAuth: []
paths:
  /cinder/{project_id}/limits:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      operationId: getLimits
      tags:
        - limits
      summary: Show absolute limits
      description: >-
        Shows rate and absolute limits for the project. The rate limits array is
        always empty; absolute limits carry quota ceilings (max*) and current
        usage (total*Used) for volumes, snapshots, backups, and gigabytes.
      responses:
        '200':
          description: Rate and absolute limits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitsResponse'
        default:
          $ref: '#/components/responses/Fault'
  /cinder/{project_id}/volumes:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      operationId: listVolumes
      tags:
        - volumes
      summary: List volumes
      description: >-
        Lists volume ids, names, and links for volumes visible to the caller.
        Since 3.31 arbitrary valid filter keys are accepted (see /resource_filters);
        unknown keys are rejected.
      parameters:
        - $ref: '#/components/parameters/AllTenantsParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
        - $ref: '#/components/parameters/MarkerParam'
        - $ref: '#/components/parameters/WithCountParam'
        - $ref: '#/components/parameters/CreatedAtFilterParam'
        - $ref: '#/components/parameters/UpdatedAtFilterParam'
        - $ref: '#/components/parameters/ConsumesQuotaFilterParam'
        - $ref: '#/components/parameters/VolumeFilterName'
        - $ref: '#/components/parameters/VolumeFilterStatus'
        - $ref: '#/components/parameters/VolumeFilterBootable'
        - $ref: '#/components/parameters/VolumeFilterMetadata'
        - $ref: '#/components/parameters/VolumeFilterMigrationStatus'
      responses:
        '200':
          description: Brief volume list, with a pagination link when more results exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumesListResponse'
        default:
          $ref: '#/components/responses/Fault'
    post:
      operationId: createVolume
      tags:
        - volumes
      summary: Create volume
      description: >-
        Creates a volume from scratch or from a snapshot (`snapshot_id`), another
        volume (`source_volid`), an image (`imageRef`), or a backup (`backup_id`,
        3.47+). `size` may be omitted when a source defines it. Scheduler hints are
        a sibling of the `volume` object, not nested inside it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVolumeRequest'
      responses:
        '202':
          description: Volume creation accepted; the volume is returned in `creating` status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeResponse'
        default:
          $ref: '#/components/responses/Fault'
  /cinder/{project_id}/volumes/detail:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      operationId: listVolumesDetail
      tags:
        - volumes
      summary: List volumes detailed
      description: >-
        Lists full volume representations. Accepts the same filters as the brief
        list. At 3.70 responses include `group_id` (3.13), `service_uuid` and
        `shared_targets` (3.48, tri-state since 3.69), `cluster_name` (3.61, admin),
        `volume_type_id` (3.63), `encryption_key_id` (3.64, admin), and
        `consumes_quota` (3.65).
      parameters:
        - $ref: '#/components/parameters/AllTenantsParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
        - $ref: '#/components/parameters/MarkerParam'
        - $ref: '#/components/parameters/WithCountParam'
        - $ref: '#/components/parameters/CreatedAtFilterParam'
        - $ref: '#/components/parameters/UpdatedAtFilterParam'
        - $ref: '#/components/parameters/ConsumesQuotaFilterParam'
        - $ref: '#/components/parameters/VolumeFilterName'
        - $ref: '#/components/parameters/VolumeFilterStatus'
        - $ref: '#/components/parameters/VolumeFilterBootable'
        - $ref: '#/components/parameters/VolumeFilterMetadata'
        - $ref: '#/components/parameters/VolumeFilterMigrationStatus'
      responses:
        '200':
          description: Detailed volume list, with a pagination link when more results exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumesDetailListResponse'
        default:
          $ref: '#/components/responses/Fault'
  /cinder/{project_id}/volumes/summary:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      operationId: getVolumesSummary
      tags:
        - volumes
      summary: Show volumes summary
      description: >-
        Shows the total count and total size in GiB of volumes visible to the
        caller (3.12+). Includes aggregated metadata since 3.36.
      parameters:
        - $ref: '#/components/parameters/AllTenantsParam'
      responses:
        '200':
          description: The volume summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumesSummaryResponse'
        default:
          $ref: '#/components/responses/Fault'
  /cinder/{project_id}/volumes/{volume_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/VolumeIdParam'
    get:
      operationId: getVolume
      tags:
        - volumes
      summary: Show volume details
      description: Shows details for a volume visible to the caller.
      responses:
        '200':
          description: The volume.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeResponse'
        default:
          $ref: '#/components/responses/Fault'
    put:
      operationId: updateVolume
      tags:
        - volumes
      summary: Update volume
      description: >-
        Updates the volume's name, description, and/or metadata. A metadata map
        given here replaces existing keys it names and keeps the rest.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVolumeRequest'
      responses:
        '200':
          description: The updated volume.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeResponse'
        default:
          $ref: '#/components/responses/Fault'
    delete:
      operationId: deleteVolume
      tags:
        - volumes
      summary: Delete volume
      description: >-
        Deletes a volume. The volume must not be attached, be part of a group,
        have snapshots (unless `cascade` is set), or be awaiting a transfer.
      parameters:
        - name: cascade
          in: query
          required: false
          description: Also delete the volume's snapshots.
          schema:
            type: boolean
        - name: force
          in: query
          required: false
          description: Delete regardless of state; skips the status check (admin).
          schema:
            type: boolean
      responses:
        '202':
          description: Volume deletion accepted.
        default:
          $ref: '#/components/responses/Fault'
  /cinder/{project_id}/volumes/{volume_id}/action:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/VolumeIdParam'
    post:
      operationId: performVolumeAction
      tags:
        - volume-actions
      summary: Run a volume action
      description: >-
        Runs one of the volume actions valid at microversion 3.70. The request body
        has exactly one top-level key naming the action. Most actions return 202
        with an empty body; `os-initialize_connection` and `os-show_image_metadata`
        return 200 with a body, and `os-volume_upload_image` returns 202 with the
        image upload details.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VolumeActionRequest'
      responses:
        '200':
          description: >-
            Synchronous action result: the connection info for
            `os-initialize_connection`, or the image metadata for
            `os-show_image_metadata`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeActionSyncResponse'
        '202':
          description: >-
            Action accepted. The body is empty except for `os-volume_upload_image`
            (the image upload details).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeActionAcceptedResponse'
        default:
          $ref: '#/components/responses/Fault'
  /cinder/{project_id}/volumes/{volume_id}/metadata:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/VolumeIdParam'
    get:
      operationId: getVolumeMetadata
      tags:
        - volume-metadata
      summary: List volume metadata
      description: Lists all metadata for the volume.
      responses:
        '200':
          description: The metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeMetadataResponse'
        default:
          $ref: '#/components/responses/Fault'
    put:
      operationId: replaceVolumeMetadata
      tags:
        - volume-metadata
      summary: Replace volume metadata
      description: Replaces all metadata; keys not in the request are deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VolumeMetadataResponse'
      responses:
        '200':
          description: The resulting metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeMetadataResponse'
        default:
          $ref: '#/components/responses/Fault'
    post:
      operationId: mergeVolumeMetadata
      tags:
        - volume-metadata
      summary: Merge volume metadata
      description: Creates or replaces the given keys; other keys are untouched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VolumeMetadataResponse'
      responses:
        '200':
          description: The resulting metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeMetadataResponse'
        default:
          $ref: '#/components/responses/Fault'
  /cinder/{project_id}/volumes/{volume_id}/metadata/{key}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/VolumeIdParam'
      - $ref: '#/components/parameters/MetadataKeyParam'
    get:
      operationId: getVolumeMetadataItem
      tags:
        - volume-metadata
      summary: Show a metadata item
      description: Shows one metadata key/value pair.
      responses:
        '200':
          description: The metadata item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeMetadataItemResponse'
        default:
          $ref: '#/components/responses/Fault'
    put:
      operationId: setVolumeMetadataItem
      tags:
        - volume-metadata
      summary: Create or replace a metadata item
      description: Creates or replaces one metadata key; the body key must match the path key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VolumeMetadataItemResponse'
      responses:
        '200':
          description: The metadata item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeMetadataItemResponse'
        default:
          $ref: '#/components/responses/Fault'
    delete:
      operationId: deleteVolumeMetadataItem
      tags:
        - volume-metadata
      summary: Delete a metadata item
      description: Deletes one metadata key.
      responses:
        '200':
          description: Metadata item deleted.
        default:
          $ref: '#/components/responses/Fault'
  /cinder/{project_id}/snapshots:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      operationId: listSnapshots
      tags:
        - snapshots
      summary: List snapshots
      description: Lists brief snapshot representations visible to the caller.
      parameters:
        - $ref: '#/components/parameters/AllTenantsParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
        - $ref: '#/components/parameters/MarkerParam'
        - $ref: '#/components/parameters/WithCountParam'
        - $ref: '#/components/parameters/ConsumesQuotaFilterParam'
        - $ref: '#/components/parameters/SnapshotFilterName'
        - $ref: '#/components/parameters/SnapshotFilterStatus'
        - $ref: '#/components/parameters/SnapshotFilterVolumeId'
      responses:
        '200':
          description: Snapshot list, with a pagination link when more results exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotsListResponse'
        default:
          $ref: '#/components/responses/Fault'
    post:
      operationId: createSnapshot
      tags:
        - snapshots
      summary: Create snapshot
      description: >-
        Creates a snapshot of a volume. Since 3.66 snapshots of in-use volumes no
        longer need the `force` flag; passing `force: false` is rejected there.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSnapshotRequest'
      responses:
        '202':
          description: Snapshot creation accepted; the snapshot is returned in `creating` status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotResponse'
        default:
          $ref: '#/components/responses/Fault'
  /cinder/{project_id}/snapshots/detail:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      operationId: listSnapshotsDetail
      tags:
        - snapshots
      summary: List snapshots detailed
      description: >-
        Lists full snapshot representations, including the extended snapshot
        attributes (progress and owning project id).
      parameters:
        - $ref: '#/components/parameters/AllTenantsParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
        - $ref: '#/components/parameters/MarkerParam'
        - $ref: '#/components/parameters/WithCountParam'
        - $ref: '#/components/parameters/ConsumesQuotaFilterParam'
        - $ref: '#/components/parameters/SnapshotFilterName'
        - $ref: '#/components/parameters/SnapshotFilterStatus'
        - $ref: '#/components/parameters/SnapshotFilterVolumeId'
      responses:
        '200':
          description: Detailed snapshot list, with a pagination link when more results exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotsDetailListResponse'
        default:
          $ref: '#/components/responses/Fault'
  /cinder/{project_id}/snapshots/{snapshot_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/SnapshotIdParam'
    get:
      operationId: getSnapshot
      tags:
        - snapshots
      summary: Show snapshot details
      description: Shows details for a snapshot, including the extended snapshot attributes.
      responses:
        '200':
          description: The snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotDetailResponse'
        default:
          $ref: '#/components/responses/Fault'
    put:
      operationId: updateSnapshot
      tags:
        - snapshots
      summary: Update snapshot
      description: Updates the snapshot's name and/or description.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSnapshotRequest'
      responses:
        '200':
          description: The updated snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotResponse'
        default:
          $ref: '#/components/responses/Fault'
    delete:
      operationId: deleteSnapshot
      tags:
        - snapshots
      summary: Delete snapshot
      description: Deletes a snapshot in `available` or `error` status.
      responses:
        '202':
          description: Snapshot deletion accepted.
        default:
          $ref: '#/components/responses/Fault'
  /cinder/{project_id}/snapshots/{snapshot_id}/action:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/SnapshotIdParam'
    post:
      operationId: performSnapshotAction
      tags:
        - snapshot-actions
      summary: Run a snapshot action
      description: >-
        Runs one of the snapshot actions: `os-reset_status`, `os-force_delete`,
        `os-unmanage` (all admin), or `os-update_snapshot_status`
        (service-to-service; used by Nova for assisted snapshots). The request body
        has exactly one top-level key naming the action.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnapshotActionRequest'
      responses:
        '202':
          description: Action accepted.
        default:
          $ref: '#/components/responses/Fault'
  /cinder/{project_id}/snapshots/{snapshot_id}/metadata:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/SnapshotIdParam'
    get:
      operationId: getSnapshotMetadata
      tags:
        - snapshot-metadata
      summary: List snapshot metadata
      description: Lists all metadata for the snapshot.
      responses:
        '200':
          description: The metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeMetadataResponse'
        default:
          $ref: '#/components/responses/Fault'
    put:
      operationId: replaceSnapshotMetadata
      tags:
        - snapshot-metadata
      summary: Replace snapshot metadata
      description: Replaces all metadata; keys not in the request are deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VolumeMetadataResponse'
      responses:
        '200':
          description: The resulting metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeMetadataResponse'
        default:
          $ref: '#/components/responses/Fault'
    post:
      operationId: mergeSnapshotMetadata
      tags:
        - snapshot-metadata
      summary: Merge snapshot metadata
      description: Creates or replaces the given keys; other keys are untouched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VolumeMetadataResponse'
      responses:
        '200':
          description: The resulting metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeMetadataResponse'
        default:
          $ref: '#/components/responses/Fault'
  /cinder/{project_id}/snapshots/{snapshot_id}/metadata/{key}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/SnapshotIdParam'
      - $ref: '#/components/parameters/MetadataKeyParam'
    get:
      operationId: getSnapshotMetadataItem
      tags:
        - snapshot-metadata
      summary: Show a metadata item
      description: Shows one metadata key/value pair.
      responses:
        '200':
          description: The metadata item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeMetadataItemResponse'
        default:
          $ref: '#/components/responses/Fault'
    put:
      operationId: setSnapshotMetadataItem
      tags:
        - snapshot-metadata
      summary: Create or replace a metadata item
      description: Creates or replaces one metadata key; the body key must match the path key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VolumeMetadataItemResponse'
      responses:
        '200':
          description: The metadata item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeMetadataItemResponse'
        default:
          $ref: '#/components/responses/Fault'
    delete:
      operationId: deleteSnapshotMetadataItem
      tags:
        - snapshot-metadata
      summary: Delete a metadata item
      description: Deletes one metadata key.
      responses:
        '200':
          description: Metadata item deleted.
        default:
          $ref: '#/components/responses/Fault'
  /cinder/{project_id}/backups:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      operationId: listBackups
      tags:
        - backups
      summary: List backups
      description: Lists backup ids, names, and links for backups visible to the caller.
      parameters:
        - $ref: '#/components/parameters/AllTenantsParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
        - $ref: '#/components/parameters/MarkerParam'
        - $ref: '#/components/parameters/WithCountParam'
        - $ref: '#/components/parameters/BackupFilterName'
        - $ref: '#/components/parameters/BackupFilterStatus'
        - $ref: '#/components/parameters/BackupFilterVolumeId'
      responses:
        '200':
          description: Brief backup list, with a pagination link when more results exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupsListResponse'
        default:
          $ref: '#/components/responses/Fault'
    post:
      operationId: createBackup
      tags:
        - backups
      summary: Create backup
      description: >-
        Creates a backup of a volume or of a snapshot (`snapshot_id`). `force`
        allows backing up an in-use volume. `metadata` is accepted since 3.43 and
        `availability_zone` since 3.51. Pass `incremental` for an incremental
        backup on top of the latest full backup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBackupRequest'
