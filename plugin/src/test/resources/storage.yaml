        member volume ids (3.25+). Responses include `replication_status` since
        3.38 and `project_id` since 3.58.
      parameters:
        - $ref: '#/components/parameters/AllTenantsParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
        - $ref: '#/components/parameters/MarkerParam'
        - $ref: '#/components/parameters/GroupListVolumeParam'
      responses:
        '200':
          description: Detailed group list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupsDetailListResponse'
        default:
          $ref: '#/components/responses/Fault'
  /cinder/{project_id}/groups/{group_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/GroupIdParam'
    get:
      operationId: getGroup
      tags:
        - groups
      summary: Show group details
      description: Shows details for a group (3.13+). Pass `list_volume=true` to embed member volume ids (3.25+).
      parameters:
        - $ref: '#/components/parameters/GroupListVolumeParam'
      responses:
        '200':
          description: The group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        default:
          $ref: '#/components/responses/Fault'
    put:
      operationId: updateGroup
      tags:
