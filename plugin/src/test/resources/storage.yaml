    get:
      operationId: listGroupSnapshotsDetail
      tags:
        - group-snapshots
      summary: List group snapshots detailed
      description: Lists full group snapshot representations (3.14+). Includes `project_id` since 3.58.
      parameters:
        - $ref: '#/components/parameters/AllTenantsParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
        - $ref: '#/components/parameters/MarkerParam'
      responses:
        '200':
          description: Detailed group snapshot list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupSnapshotsDetailListResponse'
        default:
          $ref: '#/components/responses/Fault'
  /cinder/{project_id}/group_snapshots/{group_snapshot_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/GroupSnapshotIdParam'
    get:
      operationId: getGroupSnapshot
      tags:
        - group-snapshots
      summary: Show group snapshot details
      description: Shows details for a group snapshot (3.14+).
      responses:
        '200':
          description: The group snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupSnapshotResponse'
        default:
          $ref: '#/components/responses/Fault'
    delete:
