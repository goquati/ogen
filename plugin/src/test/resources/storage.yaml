      - $ref: '#/components/parameters/QosSpecsIdParam'
    get:
      operationId: getQosSpecs
      tags:
        - qos-specs
      summary: Show QoS specs details
      description: Shows details for a QoS specification (admin).
      responses:
        '200':
          description: The QoS specs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QosSpecsResponse'
        default:
          $ref: '#/components/responses/Fault'
    put:
      operationId: updateQosSpecs
      tags:
        - qos-specs
