        default:
          $ref: '#/components/responses/Fault'
    delete:
      operationId: deleteAttachment
      tags:
        - attachments
      summary: Delete attachment
      description: >-
        Deletes the attachment, detaching the volume from its host. For volumes
        with multiple attachments only this attachment is removed (3.27+).
      responses:
        '200':
          description: Attachment deleted.
        default:
          $ref: '#/components/responses/Fault'
