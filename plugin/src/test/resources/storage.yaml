      responses:
        '200':
          description: The attachments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentsListResponse'
        default:
          $ref: '#/components/responses/Fault'
    post:
      operationId: createAttachment
      tags:
        - attachments
      summary: Create attachment
      description: >-
        Creates an attachment record for a volume (3.27+). Without a `connector`
        the attachment is reserved and must be updated with the connector later;
        with one, the returned attachment carries the `connection_info` needed to
        connect the host. `mode` is accepted since 3.54. This is the workflow Nova
