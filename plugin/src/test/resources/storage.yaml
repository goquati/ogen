      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAttachmentRequest'
      responses:
        '200':
          description: The new attachment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentResponse'
        default:
          $ref: '#/components/responses/Fault'
