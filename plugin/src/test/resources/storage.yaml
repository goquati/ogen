      summary: Update group
      description: >-
        Updates the group's name and/or description, and/or adds and removes member
        volumes given as comma-separated volume id lists (3.13+).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGroupRequest'
      responses:
        '202':
          description: Update accepted.
        default:
          $ref: '#/components/responses/Fault'
  /cinder/{project_id}/groups/action:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    post:
      operationId: createGroupFromSource
      tags:
        - groups
      summary: Create group from source
      description: >-
        Creates a group, with volumes, from a group snapshot (`group_snapshot_id`)
        or from another group (`source_group_id`) (3.14+). The request body has the
        single top-level key `create-from-src`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupFromSourceRequest'
      responses:
        '202':
          description: Group creation accepted; contains the new group's id and name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupBriefResponse'
        default:
          $ref: '#/components/responses/Fault'
  /cinder/{project_id}/groups/{group_id}/action:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/GroupIdParam'
    post:
      operationId: performGroupAction
      tags:
        - group-actions
      summary: Run a group action
      description: >-
        Runs one of the group actions: `delete` (3.13+; groups are never deleted
        with the DELETE verb), `reset_status` (3.20+, admin), or the replication
        actions `enable_replication`, `disable_replication`, `failover_replication`,
        and `list_replication_targets` (3.38+). The request body has exactly one
        top-level key naming the action. All actions return 202 with an empty body
        except `list_replication_targets`, which returns 200 with the targets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupActionRequest'
      responses:
        '200':
          description: The replication targets (`list_replication_targets` only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupReplicationTargetsResponse'
        '202':
          description: Action accepted.
        default:
          $ref: '#/components/responses/Fault'
  /cinder/{project_id}/group_snapshots:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      operationId: listGroupSnapshots
      tags:
        - group-snapshots
      summary: List group snapshots
      description: Lists group snapshot ids and names visible to the caller (3.14+).
      parameters:
        - $ref: '#/components/parameters/AllTenantsParam'
        - $ref: '#/components/parameters/SortParam'
