  /cinder/{project_id}/group_snapshots/{group_snapshot_id}/action:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/GroupSnapshotIdParam'
    post:
      operationId: performGroupSnapshotAction
      tags:
        - group-snapshots
      summary: Run a group snapshot action
      description: Resets the group snapshot's status (`reset_status`, 3.19+, admin).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupSnapshotActionRequest'
      responses:
        '202':
          description: Action accepted.
        default:
          $ref: '#/components/responses/Fault'
  /cinder/{project_id}/qos-specs:
    parameters:
