        Despite being a state change, the API uses GET.
      responses:
        '202':
          description: Disassociation accepted.
        default:
          $ref: '#/components/responses/Fault'
  /cinder/{project_id}/volume-transfers:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      operationId: listVolumeTransfers
      tags:
        - volume-transfers
      summary: List volume transfers
      description: Lists transfer ids, names, and volume ids for pending transfers visible to the caller (3.55+).
      parameters:
        - $ref: '#/components/parameters/AllTenantsParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
        - $ref: '#/components/parameters/MarkerParam'
      responses:
        '200':
          description: Brief transfer list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransfersListResponse'
        default:
          $ref: '#/components/responses/Fault'
    post:
      operationId: createVolumeTransfer
      tags:
        - volume-transfers
      summary: Create volume transfer
      description: >-
        Initiates a transfer of a volume to another project (3.55+). The response
        carries the one-time `auth_key` the receiving project needs to accept.
        Snapshots transfer along unless `no_snapshots` is set; encrypted volumes
        are transferable since 3.70.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransferRequest'
      responses:
        '202':
          description: Transfer created; contains the auth key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedTransferResponse'
