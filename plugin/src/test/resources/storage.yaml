          type:
            - string
            - 'null'
          description: Name of the cluster serving the volume (admin, 3.61+).
        provider_id:
          type:
            - string
            - 'null'
          description: Backend-specific volume id (admin, 3.21+).
        encryption_key_id:
          type:
            - string
            - 'null'
          description: Barbican key id for encrypted volumes (admin, 3.64+).
        'os-vol-host-attr:host':
          type:
            - string
            - 'null'
          description: Backend hosting the volume, in host@backend#pool syntax (admin).
        'os-vol-tenant-attr:tenant_id':
          type: string
          description: Id of the project owning the volume (admin).
        'os-vol-mig-status-attr:migstat':
          type:
            - string
            - 'null'
          description: Migration status (admin).
        'os-vol-mig-status-attr:name_id':
          type:
            - string
            - 'null'
          description: Id of the volume holding the data after a migration (admin).
      required:
