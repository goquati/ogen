[versions]
kotlin = "2.4.0"
quati-util = "2.6.0"

[libraries]
poet = { module = "com.squareup:kotlinpoet", version.ref = "kotlin" }
goquati-base = { module = "de.quati:kotlin-util", version.ref = "quati-util" }
goquati-poet = { module = "de.quati:kotlin-util-poet", version.ref = "quati-util" }
swagger-parser = { module = "io.swagger.parser.v3:swagger-parser", version = "2.1.48" }
swagger-generator = { module = "org.openapitools:openapi-generator", version = "7.25.0" }

[plugins]
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
gradlePluginPublish = { id = "com.gradle.plugin-publish", version = "1.2.1" }
